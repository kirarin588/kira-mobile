<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kira desk">
<meta name="theme-color" content="#07051a">
<link rel="manifest" href="desk.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>kira desk</title>
<style>
:root {
  --bg: #07051a; --fg: #f4f2ff; --muted: rgba(244, 242, 255, 0.62); --panel: rgba(18, 14, 44, 0.55); --line: rgba(255, 255, 255, 0.09);
  --a: #3b2fb5; --b: #6d28d9; --c: #0ea5e9;
  --me: #ff5fa2; --me2: #ffb400; --rv: #4fa3ff; --rv2: #7cf3d6;
  --new: #4fa3ff; --rev: #3ddc84; --gold: #ffd54a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
  font-family: -apple-system, "SF Pro Display", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; font-feature-settings: "palt"; }
body { user-select: none; -webkit-user-select: none; }
.num { font-variant-numeric: tabular-nums; }

/* 背景：時間帯で色が変わるオーロラ＋光の粒 */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #120c33 0%, var(--bg) 60%); }
.blob { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(80px); opacity: 0.42; mix-blend-mode: screen; will-change: transform; }
.blob.b1 { background: var(--a); left: -20vmax; top: -30vmax; animation: drift1 38s ease-in-out infinite alternate; }
.blob.b2 { background: var(--b); right: -25vmax; top: -10vmax; animation: drift2 46s ease-in-out infinite alternate; }
.blob.b3 { background: var(--c); left: 10vmax; bottom: -45vmax; animation: drift3 52s ease-in-out infinite alternate; opacity: 0.3; }
@keyframes drift1 { to { transform: translate(22vmax, 14vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-18vmax, 20vmax) scale(0.9); } }
@keyframes drift3 { to { transform: translate(16vmax, -12vmax) scale(1.2); } }
#sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#dim { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; }

/* 全体（焼き付きを防ぐため、ゆっくり数ピクセルずつ動かす） */
#app { position: relative; z-index: 2; height: 100%; padding: max(18px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
  display: grid; grid-template-rows: auto 1fr auto; gap: 14px; transition: transform 6s ease-in-out; }

/* 上：時計・日付・試験 */
.top { display: flex; align-items: flex-end; gap: 22px; }
.clock { display: flex; align-items: baseline; gap: 4px; line-height: 0.9; }
.clock .hm { font-size: clamp(64px, 11vw, 148px); font-weight: 200; letter-spacing: -0.04em; }
.clock .hm .colon { animation: blink 2s steps(1) infinite; opacity: 0.9; }
@keyframes blink { 50% { opacity: 0.25; } }
.clock .sec { font-size: clamp(18px, 2.2vw, 30px); font-weight: 300; color: var(--muted); width: 1.6em; }
.dig { display: inline-block; }
.dig.flip { animation: flip 0.6s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes flip { 0% { transform: translateY(-40%) rotateX(80deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.date { padding-bottom: 10px; }
.date .d { font-size: clamp(18px, 2.2vw, 28px); font-weight: 700; }
.date .w { font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; }
.grow { flex: 1; }
.exam { padding: 12px 18px; border-radius: 20px; background: linear-gradient(135deg, rgba(79, 163, 255, 0.28), rgba(155, 123, 255, 0.28)); border: 1px solid rgba(255, 255, 255, 0.15);
  text-align: center; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); margin-bottom: 6px; }
.exam .l { font-size: 12px; color: var(--muted); }
.exam .n { font-size: clamp(30px, 3.6vw, 48px); font-weight: 800; line-height: 1.05; }
.exam .n small { font-size: 0.4em; font-weight: 700; margin-left: 2px; }
.exam.hot { background: linear-gradient(135deg, rgba(239, 68, 68, 0.45), rgba(249, 115, 22, 0.35)); animation: hot 2.4s ease-in-out infinite; }
@keyframes hot { 50% { box-shadow: 0 0 34px rgba(239, 68, 68, 0.55); } }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--fg); font-size: 16px;
  margin-bottom: 8px; opacity: 0.35; transition: opacity 0.3s; }
.iconbtn:hover, .iconbtn:active { opacity: 1; }

/* 真ん中：2人のパネルと VS */
.main { display: grid; grid-template-columns: 1fr minmax(200px, 0.62fr) 1fr; gap: 14px; min-height: 0; }
.panel { position: relative; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 26px; background: var(--panel);
  border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); overflow: hidden; animation: rise 0.9s cubic-bezier(.2, .9, .3, 1) both; }
.panel.rv { animation-delay: 0.15s; }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } }
.panel::before { content: ""; position: absolute; inset: -1px; border-radius: 26px; padding: 1px; pointer-events: none;
  background: linear-gradient(140deg, var(--p1), transparent 40%, transparent 60%, var(--p2)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.8; }
.panel.me { --p1: var(--me); --p2: var(--me2); }
.panel.rv { --p1: var(--rv); --p2: var(--rv2); }
.who { display: flex; align-items: center; gap: 10px; }
.who .name { font-size: 22px; font-weight: 800; }
.who .score { margin-left: auto; text-align: right; }
.who .score b { font-size: clamp(34px, 4.2vw, 56px); font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.who .score small { display: block; font-size: 11px; color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 13px; background: rgba(255, 255, 255, 0.06); max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: flex-start; }
.state small { color: var(--muted); }
.state.on { background: rgba(61, 220, 132, 0.16); border: 1px solid rgba(61, 220, 132, 0.35); }
.state.brk { background: rgba(47, 184, 114, 0.12); }
.state.pause { background: rgba(255, 180, 0, 0.12); }
.state .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; flex: none; box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.7); animation: pulse 1.6s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }

.rings { display: flex; gap: 14px; justify-content: space-around; }
.ring { position: relative; width: clamp(92px, 9.5vw, 128px); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 9; }
.ring .tr { stroke: rgba(255, 255, 255, 0.08); }
.ring .pr { stroke-linecap: round; transition: stroke-dashoffset 1.6s cubic-bezier(.2, .8, .2, 1); filter: drop-shadow(0 0 6px var(--rc)); }
.ring.done .pr { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 14px var(--rc)); } }
.ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .in b { font-size: clamp(20px, 2.2vw, 28px); font-weight: 800; line-height: 1; }
.ring .in small { font-size: 11px; color: var(--muted); }
.ring .lb { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--muted); max-width: 140%; overflow: hidden; text-overflow: ellipsis; }
.rings { margin-bottom: 14px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { padding: 8px 6px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); text-align: center; }
.stats span { display: block; font-size: 10.5px; color: var(--muted); }
.stats b { font-size: 18px; font-weight: 800; white-space: nowrap; }
.stats b small { font-size: 10px; font-weight: 600; color: var(--muted); margin: 0 1px; }

.plan { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.plan h3 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.plan h3 span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: auto; }
.plan .list { overflow: hidden; display: flex; flex-direction: column; gap: 5px; mask-image: linear-gradient(#000 85%, transparent); -webkit-mask-image: linear-gradient(#000 85%, transparent); }
.it { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); font-size: 13.5px; animation: slidein 0.6s both; }
@keyframes slidein { from { transform: translateX(-12px); opacity: 0; } }
.it .ck { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); display: grid; place-items: center; font-size: 12px; }
.it.done { opacity: 0.55; }
.it.done .ck { border-color: var(--rev); background: var(--rev); color: #04210f; animation: pop 0.6s cubic-bezier(.2, 1.8, .4, 1); }
.it.done .t { text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, 0.35); }
.it.next { background: rgba(255, 255, 255, 0.09); box-shadow: inset 3px 0 0 var(--p1); }
@keyframes pop { from { transform: scale(0.3); } }
.it .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .r { color: var(--muted); font-size: 12px; flex: none; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

/* VS */
.vs { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 14px; border-radius: 26px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); min-height: 0; animation: rise 0.9s 0.08s both; }
.vs .big { font-size: clamp(36px, 4.4vw, 58px); font-weight: 900; font-style: italic; letter-spacing: -0.02em;
  background: linear-gradient(90deg, var(--me), var(--gold), var(--rv)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 4s linear infinite; }
@keyframes shine { to { background-position: 200% 0; } }
.tug { width: 100%; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--rv), var(--rv2)); overflow: hidden; position: relative; }
.tug span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--me), var(--me2)); transition: width 1.8s cubic-bezier(.2, .8, .2, 1); }
.tug span::after { content: ""; position: absolute; right: -2px; top: -3px; bottom: -3px; width: 4px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; }
.lead { text-align: center; font-size: 15px; font-weight: 800; min-height: 1.4em; }
.lead small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.first { font-size: 12px; padding: 6px 10px; border-radius: 12px; background: rgba(255, 213, 74, 0.12); border: 1px solid rgba(255, 213, 74, 0.3); text-align: center; }
.maps { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.maps h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; letter-spacing: 0.08em; }
.mp { display: grid; grid-template-columns: 4.2em 1fr 3.2em; gap: 8px; align-items: center; font-size: 12px; }
.mp .bar { height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.mp .bar span { display: block; height: 100%; border-radius: 5px; transition: width 1.8s cubic-bezier(.2, .8, .2, 1); position: relative; overflow: hidden; }
.mp .bar span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent); transform: translateX(-100%); animation: sweep 3.5s ease-in-out infinite; }
@keyframes sweep { 60%, 100% { transform: translateX(100%); } }
.mp b { text-align: right; font-size: 14px; }
.week { width: 100%; }
.week h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; letter-spacing: 0.04em; }
.week h4 b { font-size: 16px; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; height: 110px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd span { font-size: 10.5px; color: var(--muted); }
.wd.today span { color: var(--gold); font-weight: 800; }
.wb { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; justify-content: center; }
.wb i { width: 42%; height: var(--h); border-radius: 4px 4px 1px 1px; transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2, .9, .3, 1) both; }
.wb i.a { background: linear-gradient(var(--me2), var(--me)); }
.wb i.b { background: linear-gradient(var(--rv2), var(--rv)); }
.wd.today .wb { background: rgba(255, 213, 74, 0.08); border-radius: 6px; }
@keyframes grow { from { transform: scaleY(0); } }
.streak { display: flex; gap: 10px; width: 100%; }
.streak div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); }
.streak b { display: block; font-size: 22px; }
.streak span { font-size: 10.5px; color: var(--muted); }

/* 下：2人の今日の流れ（流れる文字） */
.ticker { position: relative; overflow: hidden; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker .tr { position: absolute; top: 0; left: 0; display: flex; gap: 34px; white-space: nowrap; height: 100%; align-items: center; padding-left: 100%; font-size: 13px; animation: tick linear infinite; }
.ticker .tr span b { color: var(--gold); margin-right: 6px; font-weight: 700; }
.ticker .tr .w { font-weight: 800; margin-right: 6px; }
@keyframes tick { to { transform: translateX(-100%); } }
.foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 0 6px; }

/* お知らせ */
.toast { position: fixed; left: 50%; top: 22%; z-index: 55; transform: translate(-50%, 0); padding: 16px 26px; border-radius: 22px; font-size: 20px; font-weight: 800; text-align: center;
  background: linear-gradient(135deg, rgba(255, 95, 162, 0.92), rgba(155, 92, 255, 0.92)); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); animation: toast 5.5s cubic-bezier(.2, 1.3, .4, 1) both; }
.toast small { display: block; font-size: 13px; font-weight: 600; opacity: 0.9; margin-top: 4px; }
@keyframes toast { 0% { transform: translate(-50%, -30px) scale(0.6); opacity: 0; } 10% { transform: translate(-50%, 0) scale(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }

/* はじめの画面・設定 */
.setup { position: relative; z-index: 3; max-width: 520px; margin: 12vh auto 0; padding: 26px; border-radius: 26px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.setup h1 { margin: 0 0 6px; font-size: 26px; }
.setup p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.setup input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); color: var(--fg); }
.btn { font: inherit; font-weight: 800; font-size: 15px; padding: 11px 20px; border: none; border-radius: 999px; color: #fff; background: linear-gradient(135deg, var(--me), #ff8a3d); margin-top: 12px; }
.btn.sub { background: rgba(255, 255, 255, 0.1); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: #ff9b9b; font-size: 13px; margin-top: 8px; }
.sheet { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; animation: fade 0.3s; }
@keyframes fade { from { opacity: 0; } }
.sheet .setup { margin: 0; }
.wake { position: fixed; z-index: 4; left: 50%; top: 14px; transform: translateX(-50%); transition: opacity 1s; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line); animation: fade 0.6s; }

/* 縦向き・小さい画面 */
@media (orientation: portrait), (max-width: 820px) {
  html, body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 1fr; }
  .vs { order: -1; }
  .plan .list { max-height: none; }
}
.ready .panel, .ready .vs, .ready .it, .ready .wb i { animation-name: none; }
.ready .it.done.new .ck { animation: pop 0.6s cubic-bezier(.2, 1.8, .4, 1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; transition-duration: 0.2s !important; }
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="sparks"></canvas>
<canvas id="fx"></canvas>
<div id="dim"></div>
<div id="app"></div>
<script>
(function () {
  // スマホ用ページ（index.html）と同じ Supabase。公開してよい鍵で、ルームコードがないと読めない
  const SUPABASE_URL = "https://bioamywmjxiuzhlxlxcj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZV-_zhWOiyQBoz6RXWXPlA_VGB7L8dV";
  const ROOM_KEY = "kira-mobile-room";  // スマホ用ページと同じ（同じ端末なら入れ直さなくていい）
  const ME_KEY = "kira-desk-me";
  const STALE_SEC = 6 * 60;
  const W = ["日", "月", "火", "水", "木", "金", "土"];
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}` : `${m}分`);
  const hmS = (m) => (m >= 60 ? `${Math.floor(m / 60)}<small>時間</small>${pad(m % 60)}` : `${m}<small>分</small>`);  // 狭いところ用
  const hhmm = (ms) => { const d = new Date(ms); return `${d.getHours()}:${pad(d.getMinutes())}`; };
  const app = document.getElementById("app");
  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } },
  };
  const params = new URLSearchParams(location.search);
  const DEMO = params.get("rows");  // 確かめる用：ルームコードの代わりに、手元の JSON を読む
  let room = store.get(ROOM_KEY);
  let rows = [], fetchedAt = 0, error = "", prev = null, built = false;

  function ankiToday() {
    const d = new Date(Date.now() - 4 * 3600 * 1000);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  async function load() {
    if (!room && !DEMO) return;
    try {
      const res = DEMO ? await fetch(DEMO, { cache: "no-store" }) : await fetch(
        `${SUPABASE_URL}/rest/v1/kira_scores?select=player,name,day,data,updated_at&order=day.desc&limit=40`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "x-kira-room": room } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      rows = await res.json();
      error = rows.length ? "" : "このルームコードの記録が見つかりません";
      fetchedAt = Date.now();
    } catch (e) {
      error = "読み込めませんでした（電波を確かめてください）";
    }
    render();
  }

  function players() {
    const by = {};
    rows.forEach((r) => { if (!by[r.player] || r.day > by[r.player].day) by[r.player] = r; });
    const ps = Object.values(by).sort((a, b) => String(a.name).localeCompare(String(b.name), "ja"));
    const me = store.get(ME_KEY);
    const i = ps.findIndex((p) => p.player === me);
    if (i > 0) ps.unshift(ps.splice(i, 1)[0]);
    return ps;
  }

  // いま勉強中か（アドオンの rnow.js と同じ考え方）
  function pomoPhase(p, t) {
    const work = p.work * 60, short = p.short * 60, long = p.long * 60, every = Math.max(1, p.every);
    const cycle = every * work + (every - 1) * short + long;
    const rounds = Math.floor(t / cycle), done = rounds * every;
    let rest = t - rounds * cycle;
    for (let i = 0; i < every; i++) {
      if (rest < work) return { phase: "work", count: done + i + 1, left: work - rest };
      rest -= work;
      const brk = i === every - 1 ? long : short;
      if (rest < brk) return { phase: "break", count: done + i + 1, left: brk - rest };
      rest -= brk;
    }
    return { phase: "work", count: done + every + 1, left: work };
  }
  function status(r) {
    const d = r.data || {};
    const nowMs = Date.now(), age = Math.max(0, d.sentAt ? (nowMs - d.sentAt) / 1000 : 1e9);
    const n = d.now, L = d.last || {}, m = (sec) => Math.max(0, Math.round(sec / 60));
    const la = L.answer || 0, anki = la && nowMs - la < 5 * 60 * 1000;
    const ankiWhat = L.subject ? esc(L.subject + (L.part ? `（${L.part}）` : "")) : "";
    if (n && age < STALE_SEC) {
      const what = esc((n.subject || "") + (n.kind ? "・" + n.kind : ""));
      const act = (n.active || 0) + (n.paused ? 0 : age);
      if (n.paused) return { cls: "pause", on: false, html: `⏸ ひと休み中 <small>${what}・ここまで${hm(m(act))}</small>` };
      if (n.mode === "pomodoro" && n.pomo) {
        const ph = pomoPhase(n.pomo, act);
        return ph.phase === "work"
          ? { cls: "on", on: true, html: `<i class="dot"></i>🍅 勉強中 <small>${what}・${ph.count}回目 のこり${m(ph.left)}分</small>` }
          : { cls: "brk", on: false, html: `☕ 休憩中 <small>あと${m(ph.left)}分</small>` };
      }
      if (n.mode === "timer" && n.target) return { cls: "on", on: true, html: `<i class="dot"></i>⏳ 勉強中 <small>${what}・のこり${m(n.target - act)}分</small>` };
      return { cls: "on", on: true, html: `<i class="dot"></i>⏱ 勉強中 <small>${what}・${hm(m(act))}</small>` };
    }
    if (anki) return { cls: "on", on: true, html: `<i class="dot"></i>📘 Anki で解いている <small>${ankiWhat}</small>` };
    const ts = Math.max(la, (L.study || 0) * 1000);
    if (ts && r.day === ankiToday()) {
      const ago = m((nowMs - ts) / 1000);
      return { cls: "off", on: false, html: `💤 最後の勉強 ${hhmm(ts)} <small>${ago < 60 ? ago + "分" : Math.floor(ago / 60) + "時間"}前</small>` };
    }
    return { cls: "off", on: false, html: "💤 今日はまだ勉強していません" };
  }

  // 一番乗りボーナス（アドオンの battle.py と同じ決まり。2026-11-16 から目標の大きさで重みづけ）
  const GOAL_MIN = { new: 1, focus_all: 1 / 3, reviews_all: 1 / 3, rest_reviews: 1 / 3, review: 1 / 3, chapters: 1 / 3, total: 0.25, minutes: 1 };
  function goalSize(d) {
    const gs = d.goals || [];
    if (!gs.length) return null;
    let t = 0;
    for (const g of gs) { const w = GOAL_MIN[g.type]; if (w == null) return null; t += (Number(g.target) || 0) * w; }
    return t;
  }
  function firstBonus(a, b) {
    const da = a.allDoneAt, db = b.allDoneAt;
    const pts = (f, o) => {
      const day = f.day || o.day || "";
      if (!day || day < "2026-11-16") return 20;
      const x = goalSize(f), y = goalSize(o);
      return x && y ? Math.round(20 * Math.min(1, x / y)) : 20;
    };
    if (da && (!db || da < db)) return [pts(a, b), 0];
    if (db && (!da || db < da)) return [0, pts(b, a)];
    return [0, 0];
  }
  const base = (d) => d && d.score ? (d.score.total || 0) - (d.score.first || 0) : 0;

  // 背景の色（ホームと同じく時間帯で）
  function theme() {
    const h = new Date().getHours();
    const t = h >= 5 && h < 10 ? ["#ff9a8b", "#ff6a88", "#ffd36e", "#1a0d1f"] : h >= 10 && h < 17 ? ["#4facfe", "#9b7bff", "#43e97b", "#0a0f2a"]
      : h >= 17 && h < 20 ? ["#fa709a", "#7b2cff", "#fee140", "#1c0a26"] : ["#3b2fb5", "#6d28d9", "#0ea5e9", "#07051a"];
    const s = document.documentElement.style;
    s.setProperty("--a", t[0]); s.setProperty("--b", t[1]); s.setProperty("--c", t[2]); s.setProperty("--bg", t[3]);
    // 夜中（1〜5時）は暗くする
    document.getElementById("dim").style.opacity = h >= 1 && h < 5 ? 0.55 : 0;
  }

  // 数字をなめらかに変える
  const shown = {};
  function countTo(el, to) {
    if (!el) return;
    const key = el.id, from = shown[key] == null ? 0 : shown[key];
    shown[key] = to;
    if (from === to) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 1400;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // 描き直しても、輪やバーは前の位置から動かす（30秒ごとの更新で0から伸び直さないように）
  const lastPos = {};
  function ring(id, pct, color, big, small, label, done) {
    const r = 44, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
    const from = lastPos[id] != null ? lastPos[id] : c;
    return `<div class="ring ${done ? "done" : ""}" style="--rc:${color}"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="${r}"/>
      <circle class="pr" id="${id}" cx="50" cy="50" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(1)}" style="stroke-dashoffset:${Number(from).toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>
      <div class="in"><b>${done ? "✓" : big}</b><small>${small}</small></div><div class="lb">${label}</div></div>`;
  }

  function panel(r, side) {
    const d = r.data || {}, today = r.day === ankiToday();
    const st = status(r);
    const goals = today ? d.goals || [] : [];
    const colors = ["#3ddc84", "#4fa3ff", "#ffb400", "#b38cff"];
    const rings = goals.slice(0, 3).map((g, i) => ring(`${side}-g${i}`, g.pct, colors[i % colors.length],
      g.value == null ? "—" : g.value, `/${esc(g.target)}`, esc(g.name), g.done)).join("");
    const plan = today && d.plan && d.plan.items ? d.plan.items : [];
    const next = plan.find((x) => !x.done);
    const planHtml = plan.length ? plan.map((x, i) => `<div class="it ${x.done ? "done" : ""} ${x === next ? "next" : ""}" style="animation-delay:${0.25 + i * 0.06}s">
        <span class="ck">${x.done ? "✓" : ""}</span><span class="t">${esc(x.label)}</span>
        <span class="r">${x.done ? (x.doneAt ? hhmm(x.doneAt * 1000) : "") : x.left != null ? `のこり${x.left}枚` : ""}</span></div>`).join("")
      : '<div class="empty">今日の勉強計画はまだありません</div>';
    const done = plan.filter((x) => x.done).length;
    const min = d.timeline && d.timeline.ankiMin != null ? d.timeline.ankiMin : d.minutes || 0;
    return `<section class="panel ${side}">
      <div class="who"><span class="name">${esc(r.name)}</span>
        <span class="score"><b class="num" id="${side}-sc">0</b><small>今日のスコア</small></span></div>
      <div class="state ${st.cls}" id="${side}-st">${today ? st.html : `💤 今日の記録はまだ届いていません`}</div>
      ${rings ? `<div class="rings">${rings}</div>` : ""}
      <div class="stats"><div><span>新規</span><b class="num">${today ? d.newCards ?? "—" : "—"}</b></div><div><span>復習</span><b class="num">${today ? d.reviewed ?? "—" : "—"}</b></div>
        <div><span>Anki</span><b class="num">${today ? hmS(min) : "—"}</b></div><div><span>連続</span><b class="num">${d.streak != null ? d.streak + "日" : "—"}</b></div></div>
      <div class="plan"><h3>📋 今日の勉強計画 ${plan.length ? `<b>${done}/${plan.length}</b>` : ""}<span>${today && d.plan && d.plan.leftMin ? `のこり約${hm(d.plan.leftMin)}・${esc(d.plan.finishAt)}ごろ` : ""}</span></h3>
        <div class="list">${planHtml}</div></div>
    </section>`;
  }

  function vsPanel(me, rv) {
    const md = (me && me.day === ankiToday() && me.data) || {}, rd = (rv && rv.day === ankiToday() && rv.data) || {};
    const [fa, fb] = rv ? firstBonus(md, rd) : [0, 0];
    const a = base(md) + fa, b = base(rd) + fb;
    const diff = a - b, share = a + b ? (a * 100) / (a + b) : 50;
    const lead = !rv ? "" : diff > 0 ? `🔥 ${esc(me.name)} が ${diff}点リード` : diff < 0 ? `🔥 ${esc(rv.name)} が ${-diff}点リード` : "⚔ 同点";
    const firstTxt = md.allDoneAt && (!rd.allDoneAt || md.allDoneAt < rd.allDoneAt) ? `🥇 ${esc(me.name)} が一番乗り（+${fa}）`
      : rd.allDoneAt ? `🥇 ${esc(rv.name)} が一番乗り（+${fb}）` : "🏁 先に目標を全部終えたほうに 最大 +20";
    const maps = [me, rv].filter((p) => p && p.data && p.data.map);
    const mapHtml = maps.map((p, i) => `<div class="mp"><span>${esc(p.name)}</span><div class="bar"><span id="mp${i}" data-w="${p.data.map.pct}"
        style="width:${lastPos["mp" + i] || 0}%;background:linear-gradient(90deg,${i ? "var(--rv),var(--rv2)" : "var(--me),var(--me2)"})"></span></div><b class="num">${p.data.map.pct}%</b></div>`).join("");
    return { a, b, html: `<section class="vs">
      <div class="big">VS</div>
      <div class="tug"><span id="tug" style="width:${lastPos.tug != null ? lastPos.tug : 50}%" data-w="${share.toFixed(1)}"></span></div>
      <div class="lead">${lead}<small>${rv ? `${esc(me.name)} ${a} ー ${b} ${esc(rv.name)}` : ""}</small></div>
      ${rv ? `<div class="first">${firstTxt}</div>` : ""}
      ${rv ? weekHtml(me, rv) : ""}
      ${maps.length ? `<div class="maps"><h4>📈 進捗率</h4>${mapHtml}</div>` : ""}
    </section>` };
  }

  // この7日のスコア（それぞれの日の勝ち負けも）
  function weekHtml(me, rv) {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - 4 * 3600 * 1000 - i * 86400000);
      days.push({ iso: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, w: W[d.getDay()] });
    }
    const find = (p, iso) => rows.find((r) => r.player === p.player && r.day === iso);
    let wa = 0, wb = 0;
    const vals = days.map(({ iso, w }) => {
      const a = find(me, iso), b = find(rv, iso);
      const ad = (a && a.data) || {}, bd = (b && b.data) || {};
      const [fa, fb] = a && b ? firstBonus(ad, bd) : [0, 0];
      const x = a ? base(ad) + fa : null, y = b ? base(bd) + fb : null;
      const past = iso < ankiToday();
      if (past && x != null && y != null) { if (x > y) wa++; else if (y > x) wb++; }
      return { w, x, y, today: iso === ankiToday() };
    });
    const mx = Math.max(1, ...vals.flatMap((v) => [v.x || 0, v.y || 0]));
    return `<div class="week"><h4>📅 この7日　<b style="color:var(--me)">${wa}</b> 勝 ー <b style="color:var(--rv)">${wb}</b> 勝</h4>
      <div class="wk">${vals.map((v, i) => `<div class="wd ${v.today ? "today" : ""}"><div class="wb">
          <i class="a" style="--h:${((v.x || 0) * 100) / mx}%;animation-delay:${0.3 + i * 0.07}s"></i><i class="b" style="--h:${((v.y || 0) * 100) / mx}%;animation-delay:${0.35 + i * 0.07}s"></i></div>
          <span>${v.w}</span></div>`).join("")}</div></div>`;
  }

  function examChip(ps) {
    const ex = ps.map((p) => p.data && p.data.exam).find(Boolean);
    if (!ex) return "";
    const hot = ["t7", "t3", "t0", "period"].includes(ex.tier);
    return `<div class="exam ${hot ? "hot" : ""}"><div class="l">📅 ${esc(ex.name)}${ex.inPeriod ? "" : "まで"}</div>
      <div class="n num">${ex.inPeriod ? `のこり ${ex.daysLeft}` : ex.daysTo <= 0 ? "今日から" : `あと ${ex.daysTo}`}<small>${ex.daysTo <= 0 && !ex.inPeriod ? "" : "日"}</small></div></div>`;
  }

  function ticker(ps) {
    const items = [];
    ps.forEach((p) => {
      const t = p.day === ankiToday() && p.data && p.data.timeline ? p.data.timeline.items || [] : [];
      t.slice(-8).forEach((x) => items.push({ when: x.when, who: p.name, icon: x.icon, text: x.text, t: String(x.when || "") }));
    });
    items.sort((a, b) => (a.t > b.t ? 1 : -1));
    if (!items.length) return "";
    const html = items.slice(-14).map((x) => `<span><b>${esc(x.when)}</b><span class="w">${esc(x.who)}</span>${esc(x.icon)} ${esc(x.text)}</span>`).join("");
    return `<div class="ticker"><div class="tr" style="animation-duration:${Math.max(40, items.length * 7)}s">${html}</div></div>`;
  }

  // 時計
  let lastHM = "";
  function tickClock() {
    const d = new Date();
    const h = String(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
    const el = document.getElementById("hm");
    if (el) {
      const cur = h + ":" + m;
      if (cur !== lastHM) {
        const digs = (h + m).split("");
        const old = lastHM.replace(":", "").padStart(digs.length, " ").split("");
        el.innerHTML = `${digs.slice(0, h.length).map((c, i) => `<span class="dig ${lastHM && old[i] !== c ? "flip" : ""}">${c}</span>`).join("")}<span class="colon">:</span>${digs.slice(h.length).map((c, i) => `<span class="dig ${lastHM && old[h.length + i] !== c ? "flip" : ""}">${c}</span>`).join("")}`;
        lastHM = cur;
        const dt = document.getElementById("date");
        if (dt) dt.innerHTML = `<div class="d">${d.getMonth() + 1}月${d.getDate()}日（${W[d.getDay()]}）</div><div class="w">${d.getFullYear()}</div>`;
        theme();
      }
    }
    const se = document.getElementById("sec");
    if (se) se.textContent = s;
  }

  // 変わったところでお祝い（相手が項目を終えた・目標を全部終えた など）
  function celebrate(ps) {
    const snap = {};
    ps.forEach((p) => {
      const d = p.day === ankiToday() ? p.data || {} : {};
      snap[p.player] = { name: p.name, done: (d.plan && d.plan.items || []).filter((x) => x.done).map((x) => x.label), all: !!d.allDoneAt,
        goals: (d.goals || []).filter((g) => g.done).map((g) => g.name), on: status(p).on };
    });
    if (prev) {
      Object.entries(snap).forEach(([id, s]) => {
        const o = prev[id];
        if (!o) return;
        if (s.all && !o.all) { toast(`👑 ${esc(s.name)} が今日の目標を全部クリア！`, ""); burst(260); return; }
        const g = s.goals.find((x) => !o.goals.includes(x));
        if (g) { toast(`🎯 ${esc(s.name)}「${esc(g)}」達成！`, ""); burst(140); return; }
        const it = s.done.find((x) => !o.done.includes(x));
        if (it) { toast(`✅ ${esc(s.name)} が終えた`, esc(it)); burst(80); return; }
        if (s.on && !o.on) toast(`📘 ${esc(s.name)} が勉強を始めた`, "");
      });
    }
    prev = snap;
  }
  function toast(t, sub) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = t + (sub ? `<small>${sub}</small>` : "");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5600);
  }

  // 紙吹雪
  const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  function burst(n) {
    const cols = ["#ff5fa2", "#ffb400", "#4fa3ff", "#7cf3d6", "#b38cff", "#fff"];
    for (let i = 0; i < n; i++) {
      parts.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.3, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4,
        r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, life: 1 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
  }
  function fxLoop() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    parts.forEach((p) => {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= 0.006;
      fctx.save(); fctx.globalAlpha = Math.max(0, p.life); fctx.translate(p.x, p.y); fctx.rotate(p.a);
      fctx.fillStyle = p.c; fctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); fctx.restore();
    });
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }

  // 光の粒（背景）
  const sp = document.getElementById("sparks"), sctx = sp.getContext("2d");
  let dots = [];
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    [sp, fx].forEach((c) => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px"; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); });
    dots = Array.from({ length: Math.round((innerWidth * innerHeight) / 26000) }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.6 + 0.3, v: Math.random() * 0.25 + 0.05, p: Math.random() * 6 }));
  }
  let lastT = 0;
  function sparkLoop(t) {
    if (t - lastT > 33) {  // 30fps くらいで十分（電池のため）
      lastT = t;
      sctx.clearRect(0, 0, innerWidth, innerHeight);
      dots.forEach((d) => {
        d.y -= d.v; d.p += 0.02;
        if (d.y < -4) { d.y = innerHeight + 4; d.x = Math.random() * innerWidth; }
        sctx.globalAlpha = 0.25 + 0.35 * Math.sin(d.p) ** 2;
        sctx.fillStyle = "#fff";
        sctx.beginPath(); sctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); sctx.fill();
      });
    }
    requestAnimationFrame(sparkLoop);
  }

  // 画面をつけたままにする（対応している端末だけ）
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); } } catch (e) { wakeLock = null; }
    const w = document.getElementById("wake");
    if (w) w.remove();
  }

  function setup(msg) {
    built = false;
    app.innerHTML = `<div class="setup"><h1>kira desk</h1>
      <p>机の上に置いておく、見るだけの画面です。Anki の kira の「設定 › 2人で使う」にある<b>ルームコード</b>を入れてください（この端末にだけ保存されます）。</p>
      <input id="room" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="kira-…">
      <div class="btns"><button class="btn" id="save">はじめる</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div>`;
    document.getElementById("save").onclick = () => {
      const v = document.getElementById("room").value.trim();
      if (!v) return;
      room = v; store.set(ROOM_KEY, v); error = "";
      app.innerHTML = '<div class="setup"><p>読み込んでいます…</p></div>';
      load();
    };
  }

  function settings() {
    const ps = players();
    const sh = document.createElement("div");
    sh.className = "sheet";
    sh.innerHTML = `<div class="setup"><h1>⚙ 設定</h1>
      <p>左に出す人（自分）を選んでください。</p>
      <div class="btns">${ps.map((p) => `<button class="btn ${store.get(ME_KEY) === p.player ? "" : "sub"}" data-me="${esc(p.player)}">${esc(p.name)}</button>`).join("")}</div>
      <p style="margin-top:16px">画面をつけたままにするには、iPad なら「設定 › 画面表示と明るさ › 自動ロック › なし」もおすすめです。<br>
        Safari の「共有 › ホーム画面に追加」で、アプリのように全画面で開けます。</p>
      <div class="btns"><button class="btn sub" id="rmroom">ルームコードを消す</button><button class="btn" id="close">閉じる</button></div></div>`;
    document.body.appendChild(sh);
    sh.querySelectorAll("[data-me]").forEach((b) => (b.onclick = () => { store.set(ME_KEY, b.dataset.me); sh.remove(); built = false; render(); }));
    sh.querySelector("#close").onclick = () => sh.remove();
    sh.querySelector("#rmroom").onclick = () => { if (confirm("この端末に保存したルームコードを消しますか？")) { store.del(ROOM_KEY); room = ""; rows = []; sh.remove(); setup(); } };
    sh.onclick = (e) => { if (e.target === sh) sh.remove(); };
  }

  function render() {
    if ((!room && !DEMO) || (error && !rows.length)) { setup(error); return; }
    const ps = players();
    const me = ps[0], rv = ps[1];
    const vs = vsPanel(me, rv);
    if (!built) {
      app.innerHTML = `<header class="top">
          <div class="clock"><span class="hm num" id="hm"></span><span class="sec num" id="sec"></span></div>
          <div class="date" id="date"></div><div class="grow"></div><div id="exam"></div>
          <button class="iconbtn" id="gear" aria-label="設定">⚙</button></header>
        <main class="main" id="main"></main>
        <div><div id="tick"></div><div class="foot"><span id="upd"></span><span>kira desk</span></div></div>`;
      document.getElementById("gear").onclick = (e) => { e.stopPropagation(); settings(); };
      lastHM = "";
      tickClock();
      built = true;
      Object.keys(shown).forEach((k) => delete shown[k]);
      Object.keys(lastPos).forEach((k) => delete lastPos[k]);
      app.classList.remove("ready");
    }
    document.getElementById("exam").innerHTML = examChip(ps);
    document.getElementById("main").innerHTML = (me ? panel(me, "me") : "") + vs.html + (rv ? panel(rv, "rv") : '<section class="panel rv"><div class="empty">相手のデータを待っています…</div></section>');
    const tk = ticker(ps);
    const tEl = document.getElementById("tick");
    if (tEl.dataset.k !== tk) { tEl.innerHTML = tk; tEl.dataset.k = tk; }
    document.getElementById("upd").textContent = fetchedAt ? `${hhmm(fetchedAt)} に更新・30秒ごと${error ? "・" + error : ""}` : "";
    // アニメーション：輪・バー・数字
    void app.offsetWidth;  // いまの位置を一度確定させてから動かす（そうしないと動きが出ない）
    requestAnimationFrame(() => {
      document.querySelectorAll(".ring .pr").forEach((c) => { c.style.strokeDashoffset = c.dataset.off; lastPos[c.id] = Number(c.dataset.off); });
      document.querySelectorAll("[data-w]").forEach((s) => { s.style.width = s.dataset.w + "%"; lastPos[s.id] = Number(s.dataset.w); });
      if (!app.classList.contains("ready")) setTimeout(() => app.classList.add("ready"), 3000);  // 2回目からは、出てくるときの動きはしない
      countTo(document.getElementById("me-sc"), vs.a);
      countTo(document.getElementById("rv-sc"), vs.b);
    });
    celebrate(ps);
  }

  // 焼き付き防止：1分ごとに少しだけ位置をずらす
  setInterval(() => {
    app.style.transform = `translate(${Math.round((Math.random() - 0.5) * 8)}px, ${Math.round((Math.random() - 0.5) * 6)}px)`;
  }, 60000);

  window.addEventListener("resize", size);
  size();
  requestAnimationFrame(sparkLoop);
  theme();
  setInterval(tickClock, 1000);
  setInterval(() => { if (document.visibilityState === "visible") { load(); } }, 30000);
  setInterval(() => { if (built) render(); }, 60000);  // 「○分前」などを進める
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { load(); if (wakeLock !== null) keepAwake(); } });
  // 最初にどこかを押したら、画面をつけたままにする（ブラウザの決まりで、押したときしか頼めない）
  if ("wakeLock" in navigator) {
    const w = document.createElement("div");
    w.className = "wake"; w.id = "wake"; w.textContent = "🔆 画面を押すと、つけたままにします";
    document.body.appendChild(w);
    setTimeout(() => { w.style.opacity = "0"; }, 12000);
    document.addEventListener("click", () => { if (!wakeLock) keepAwake(); }, { once: false });
  }
  render();
  load();
})();
</script>
</body>
</html>
