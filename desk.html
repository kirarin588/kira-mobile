<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kira desk">
<meta name="theme-color" content="#04030f">
<link rel="manifest" href="desk.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>kira desk</title>
<style>
:root {
  --bg: #04030f; --fg: #eef3ff; --muted: rgba(220, 230, 255, 0.58); --panel: rgba(10, 14, 38, 0.52); --line: rgba(120, 200, 255, 0.16);
  --a: #3b2fb5; --b: #6d28d9; --c: #0ea5e9;
  --cy: #5ff3ff; --me: #ff4fa0; --me2: #ffb400; --rv: #3f9dff; --rv2: #5ff3ff;
  --new: #4fa3ff; --rev: #3ddc84; --gold: #ffd54a; --red: #ff4d6d;
  --mono: "SF Mono", ui-monospace, Menlo, "Roboto Mono", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
  font-family: -apple-system, "SF Pro Display", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; font-feature-settings: "palt"; }
body { user-select: none; -webkit-user-select: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* 背景：オーロラ・流れる格子・走査線・光の粒 */
#bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #0b0a2a 0%, var(--bg) 62%); }
.blob { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(90px); opacity: 0.34; mix-blend-mode: screen; will-change: transform; }
.blob.b1 { background: var(--a); left: -20vmax; top: -30vmax; animation: drift1 38s ease-in-out infinite alternate; }
.blob.b2 { background: var(--b); right: -25vmax; top: -10vmax; animation: drift2 46s ease-in-out infinite alternate; }
.blob.b3 { background: var(--c); left: 10vmax; bottom: -45vmax; animation: drift3 52s ease-in-out infinite alternate; opacity: 0.24; }
@keyframes drift1 { to { transform: translate(22vmax, 14vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-18vmax, 20vmax) scale(0.9); } }
@keyframes drift3 { to { transform: translate(16vmax, -12vmax) scale(1.2); } }
.grid { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%; transform: perspective(600px) rotateX(62deg); transform-origin: bottom;
  background-image: linear-gradient(rgba(95, 243, 255, 0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(95, 243, 255, 0.13) 1px, transparent 1px);
  background-size: 60px 60px; animation: gridmove 6s linear infinite; mask-image: linear-gradient(transparent, #000 70%); -webkit-mask-image: linear-gradient(transparent, #000 70%); }
@keyframes gridmove { to { background-position: 0 60px; } }
.scan { position: absolute; left: 0; right: 0; height: 120px; top: -120px; background: linear-gradient(transparent, rgba(95, 243, 255, 0.06), rgba(95, 243, 255, 0.14), transparent);
  animation: scan 9s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes scan { 0% { top: -120px; } 70%, 100% { top: 110%; } }
.lines { position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 3px, rgba(0, 0, 0, 0.18) 3px 4px); opacity: 0.35; }
#sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
#fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#dim { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity 3s; }

/* 全体（焼き付きを防ぐため、ゆっくり数ピクセルずつ動かす） */
#app { position: relative; z-index: 2; height: 100%; padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px; transition: transform 6s ease-in-out; }

/* 上：時計（いつも出しておく）・日付・試験のカウントダウン */
.top { display: flex; align-items: center; gap: 20px; }
.clockbox { position: relative; display: flex; align-items: center; gap: 14px; }
.secring { width: clamp(70px, 8vw, 104px); aspect-ratio: 1; position: relative; flex: none; }
.secring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.secring circle { fill: none; stroke-width: 3; }
.secring .t { stroke: rgba(95, 243, 255, 0.12); }
.secring .p { stroke: var(--cy); stroke-linecap: round; filter: drop-shadow(0 0 4px var(--cy)); transition: stroke-dashoffset 0.95s linear; }
.secring .ticks { position: absolute; inset: 9%; border-radius: 50%; border: 1px dashed rgba(95, 243, 255, 0.25); animation: spin 30s linear infinite; }
.secring .s { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: clamp(18px, 2vw, 26px); color: var(--cy); text-shadow: 0 0 10px rgba(95, 243, 255, 0.7); }
@keyframes spin { to { transform: rotate(360deg); } }
.clock { line-height: 0.9; }
.clock .hm { font-size: clamp(64px, 10vw, 140px); font-weight: 200; letter-spacing: -0.04em; text-shadow: 0 0 30px rgba(95, 243, 255, 0.25); }
.clock .colon { animation: blink 2s steps(1) infinite; color: var(--cy); }
@keyframes blink { 50% { opacity: 0.2; } }
.dig { display: inline-block; }
.dig.flip { animation: glitch 0.7s steps(2) 1, flip 0.6s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes flip { 0% { transform: translateY(-40%) rotateX(80deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes glitch { 0% { text-shadow: -4px 0 #ff4fa0, 4px 0 #5ff3ff; } 50% { text-shadow: 3px 0 #ff4fa0, -3px 0 #5ff3ff; } 100% { text-shadow: 0 0 30px rgba(95, 243, 255, 0.25); } }
.date .d { font-size: clamp(17px, 2vw, 26px); font-weight: 700; }
.date .w { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 0.18em; }
.grow { flex: 1; }

.exam { position: relative; padding: 10px 18px 12px; border-radius: 16px; text-align: center; background: rgba(255, 77, 109, 0.08); border: 1px solid rgba(255, 77, 109, 0.35);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; }
.exam::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 77, 109, 0.25), transparent); transform: translateX(-100%); animation: sweep 4s ease-in-out infinite; }
.exam .l { font-size: 11px; letter-spacing: 0.12em; color: #ffb3c1; }
.exam .cd { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 2px; }
.exam .dd { font-size: clamp(34px, 4vw, 54px); font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 18px rgba(255, 77, 109, 0.7); }
.exam .dd small { font-size: 0.38em; font-weight: 700; margin-left: 2px; }
.exam .hms { font-family: var(--mono); font-size: clamp(20px, 2.3vw, 30px); color: #ffd1da; letter-spacing: 0.02em; }
.exam .hms .ms { color: var(--red); }
.exam .bar { height: 3px; margin-top: 6px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.exam .bar span { display: block; height: 100%; background: linear-gradient(90deg, #ffb400, var(--red)); }
.exam.hot { animation: hot 1.6s ease-in-out infinite; }
@keyframes hot { 50% { box-shadow: 0 0 40px rgba(255, 77, 109, 0.55); border-color: rgba(255, 77, 109, 0.8); } }
.tools { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
.seg button { font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); background: transparent; border: none; padding: 6px 11px; border-radius: 999px; }
.seg button.on { color: #04131a; background: var(--cy); box-shadow: 0 0 14px rgba(95, 243, 255, 0.5); }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--fg); font-size: 15px; opacity: 0.45; }
.iconbtn:active { opacity: 1; }

/* 真ん中：2人のパネルと VS */
.main { display: grid; grid-template-columns: 1fr minmax(210px, 0.62fr) 1fr; gap: 12px; min-height: 0; }
.panel, .vs { position: relative; min-height: 0; border-radius: 18px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: rise 0.9s cubic-bezier(.2, .9, .3, 1) both; }
.panel { display: flex; flex-direction: column; gap: 11px; padding: 15px 17px; overflow: hidden; }
.panel.rv { animation-delay: 0.15s; }
@keyframes rise { from { transform: translateY(26px); opacity: 0; filter: blur(6px); } }
/* 角の金具（HUD） */
.cn { position: absolute; width: 16px; height: 16px; border-color: var(--p1, var(--cy)); border-style: solid; opacity: 0.85; pointer-events: none; }
.cn.tl { left: -1px; top: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 18px; }
.cn.tr { right: -1px; top: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 18px; border-color: var(--p2, var(--cy)); }
.cn.bl { left: -1px; bottom: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 18px; }
.cn.br { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 18px; border-color: var(--p2, var(--cy)); }
.panel.me { --p1: var(--me); --p2: var(--me2); }
.panel.rv { --p1: var(--rv); --p2: var(--rv2); }
.panel .sweep { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.06) 50%, transparent 60%);
  transform: translateX(-100%); animation: sweep 7s ease-in-out infinite; }
.panel.rv .sweep { animation-delay: 3.5s; }
@keyframes sweep { 55%, 100% { transform: translateX(100%); } }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; color: var(--p1, var(--cy)); opacity: 0.8; }

.who { display: flex; align-items: center; gap: 10px; }
.who .name { font-size: 22px; font-weight: 800; }
.who .score { margin-left: auto; text-align: right; position: relative; }
.who .score b { display: inline-block; font-size: clamp(36px, 4.4vw, 60px); font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--p1), var(--p2));
  -webkit-background-clip: text; background-clip: text; color: transparent; transition: filter 0.3s; }
.who .score small { display: block; font-size: 10.5px; color: var(--muted); }
/* 得点が変わったとき：点滅＋「+12」が浮かぶ＋パネルが光る */
.who .score b.bump { animation: bump 1.4s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes bump { 0% { transform: scale(1); } 12% { transform: scale(1.32); filter: brightness(2.2) drop-shadow(0 0 18px var(--p2)); } 24% { filter: brightness(1); }
  36% { filter: brightness(2) drop-shadow(0 0 14px var(--p1)); } 48% { filter: brightness(1); } 60% { filter: brightness(1.8); } 100% { transform: scale(1); filter: none; } }
.delta { position: absolute; right: 0; top: -6px; font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--p2); text-shadow: 0 0 12px var(--p2);
  animation: up 2.2s cubic-bezier(.2, .8, .3, 1) forwards; pointer-events: none; }
.delta.minus { color: #9aa6c8; text-shadow: none; }
@keyframes up { 0% { transform: translateY(10px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
.panel.flash { animation: pflash 1.4s ease-out; }
@keyframes pflash { 0% { box-shadow: 0 0 0 0 transparent; } 15% { box-shadow: 0 0 0 2px var(--p1), 0 0 50px var(--p1); } 100% { box-shadow: 0 0 0 0 transparent; } }

.state { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 13px; background: rgba(255, 255, 255, 0.05); max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: flex-start; border: 1px solid transparent; }
.state small { color: var(--muted); }
.state.on { background: rgba(61, 220, 132, 0.12); border-color: rgba(61, 220, 132, 0.4); }
.state.brk { background: rgba(47, 184, 114, 0.1); }
.state.pause { background: rgba(255, 180, 0, 0.1); }
.state .dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; flex: none; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(61, 220, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 220, 132, 0); } }

.ringsbox { position: relative; }
.ringsbox .mode { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); margin-bottom: 6px; }
.rings { display: flex; gap: 12px; justify-content: space-around; margin: 0 0 20px; animation: ringsin 0.8s cubic-bezier(.2, .9, .3, 1); }
@keyframes ringsin { from { opacity: 0; transform: scale(0.92) rotateX(40deg); } }
.ring { position: relative; width: clamp(88px, 9vw, 122px); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 8; }
.ring .tr { stroke: rgba(255, 255, 255, 0.07); }
.ring .orb { stroke: rgba(95, 243, 255, 0.25); stroke-width: 1; stroke-dasharray: 2 6; transform-origin: 50px 50px; animation: spin 18s linear infinite; }
.ring .pr { stroke-linecap: round; transition: stroke-dashoffset 1.6s cubic-bezier(.2, .8, .2, 1); filter: drop-shadow(0 0 6px var(--rc)); }
.ring.done .pr { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 14px var(--rc)); } }
.ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .in b { font-size: clamp(19px, 2.1vw, 27px); font-weight: 800; line-height: 1; }
.ring .in small { font-size: 10.5px; color: var(--muted); }
.ring .in i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--rc); margin-top: 2px; }
.ring .lb { position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; color: var(--muted); max-width: 150%; overflow: hidden; text-overflow: ellipsis; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.stats div { padding: 7px 6px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.05); text-align: center; }
.stats span { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
.stats b { font-size: 18px; font-weight: 800; white-space: nowrap; }
.stats b small { font-size: 10px; font-weight: 600; color: var(--muted); margin: 0 1px; }

.plan { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.plan h3 { margin: 0; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.plan h3 span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: auto; }
.plan .list { overflow: hidden; display: flex; flex-direction: column; gap: 5px; mask-image: linear-gradient(#000 85%, transparent); -webkit-mask-image: linear-gradient(#000 85%, transparent); }
.it { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.035); font-size: 13.5px; animation: slidein 0.6s both; }
@keyframes slidein { from { transform: translateX(-14px); opacity: 0; } }
.it .ck { width: 19px; height: 19px; flex: none; border-radius: 5px; border: 1.5px solid rgba(255, 255, 255, 0.3); display: grid; place-items: center; font-size: 12px; }
.it.done { opacity: 0.5; }
.it.done .ck { border-color: var(--rev); background: var(--rev); color: #04210f; }
.it.done .t { text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, 0.35); }
.it.next { background: rgba(255, 255, 255, 0.08); box-shadow: inset 3px 0 0 var(--p1); }
.it.next .ck { border-color: var(--p1); animation: blinkbox 1.8s ease-in-out infinite; }
@keyframes blinkbox { 50% { box-shadow: 0 0 10px var(--p1); } }
.it .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .r { color: var(--muted); font-size: 12px; flex: none; font-family: var(--mono); }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

/* VS */
.vs { display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 15px 14px; animation-delay: 0.08s; overflow: hidden; }
.vs .big { font-size: clamp(36px, 4.4vw, 58px); font-weight: 900; font-style: italic; letter-spacing: -0.02em; line-height: 1;
  background: linear-gradient(90deg, var(--me), var(--gold), var(--rv), var(--me)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear infinite; }
@keyframes shine { to { background-position: 300% 0; } }
.tug { width: 100%; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--rv), var(--rv2)); overflow: hidden; position: relative; }
.tug span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--me), var(--me2)); transition: width 1.8s cubic-bezier(.2, .8, .2, 1); }
.tug span::after { content: ""; position: absolute; right: -2px; top: -3px; bottom: -3px; width: 4px; background: #fff; border-radius: 2px; box-shadow: 0 0 12px #fff; animation: spark 1.2s ease-in-out infinite; }
@keyframes spark { 50% { box-shadow: 0 0 22px #fff, 0 0 6px var(--gold); } }
.lead { text-align: center; font-size: 15px; font-weight: 800; min-height: 1.4em; }
.lead small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; margin-top: 2px; font-family: var(--mono); }
.first { font-size: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(255, 213, 74, 0.1); border: 1px solid rgba(255, 213, 74, 0.3); text-align: center; }
.sec-t { margin: 0 0 7px; font-size: 10.5px; color: var(--muted); font-weight: 600; text-align: center; letter-spacing: 0.12em; font-family: var(--mono); }
.sec-t b { font-size: 15px; font-family: inherit; }
.maps { width: 100%; display: flex; flex-direction: column; gap: 9px; margin-top: auto; }
.mp { display: grid; grid-template-columns: 4.2em 1fr 3.4em; gap: 8px; align-items: center; font-size: 12px; }
.mp .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.mp .bar span { display: block; height: 100%; border-radius: 4px; transition: width 1.8s cubic-bezier(.2, .8, .2, 1); position: relative; overflow: hidden; }
.mp .bar span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); transform: translateX(-100%); animation: sweep 3.5s ease-in-out infinite; }
.mp b { text-align: right; font-size: 13px; font-family: var(--mono); }
.week { width: 100%; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; height: 100px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd span { font-size: 10.5px; color: var(--muted); }
.wd.today span { color: var(--gold); font-weight: 800; }
.wb { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; justify-content: center; }
.wb i { width: 42%; height: var(--h); border-radius: 3px 3px 1px 1px; transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2, .9, .3, 1) both; }
.wb i.a { background: linear-gradient(var(--me2), var(--me)); }
.wb i.b { background: linear-gradient(var(--rv2), var(--rv)); }
.wd.today .wb { background: rgba(255, 213, 74, 0.08); border-radius: 6px; }
@keyframes grow { from { transform: scaleY(0); } }

/* 下：2人の今日の流れ（流れる文字） */
.ticker { position: relative; overflow: hidden; height: 32px; border-radius: 10px; background: rgba(95, 243, 255, 0.04); border: 1px solid var(--line);
  mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker .tr { position: absolute; top: 0; left: 0; display: flex; gap: 34px; white-space: nowrap; height: 100%; align-items: center; padding-left: 100%; font-size: 13px; animation: tick linear infinite; }
.ticker .tr span b { color: var(--cy); margin-right: 6px; font-weight: 700; font-family: var(--mono); }
.ticker .tr .w { font-weight: 800; margin-right: 6px; }
@keyframes tick { to { transform: translateX(-100%); } }
.foot { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); padding: 4px 6px 0; font-family: var(--mono); letter-spacing: 0.06em; }
.foot .live::before { content: "●"; color: #3ddc84; margin-right: 6px; animation: blink 2s steps(1) infinite; }

/* ⏱ いま測っている時間（真ん中にいちばん大きく） */
.hero { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hero .hk { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--tc); }
.tm { position: relative; width: min(100%, 300px); aspect-ratio: 1; container-type: inline-size; }
.tm svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.tm circle { fill: none; }
.tm .bg { stroke: rgba(255, 255, 255, 0.07); stroke-width: 10; }
.tm .pg { stroke: var(--tc); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 10px var(--tc)); transition: stroke-dashoffset 1s linear; }
.tm .o1 { stroke: var(--tc); stroke-width: 1; opacity: 0.35; stroke-dasharray: 1 7; transform-origin: 50px 50px; animation: spin 24s linear infinite; }
.tm .o2 { stroke: var(--tc); stroke-width: 2; opacity: 0.5; stroke-dasharray: 30 270; transform-origin: 50px 50px; animation: spin 3s linear infinite; }
.tm.paused .o2, .tm.paused .o1 { animation-play-state: paused; }
.tm .ct { position: absolute; inset: 14%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.5cqw; }
.tm .ph { font-size: 15px; font-size: clamp(10px, 5.4cqw, 16px); font-weight: 800; color: var(--tc); text-shadow: 0 0 12px var(--tc); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 数字は円の大きさに合わせる（円の内側の幅におさまるように）。時間が入る「1:23:45」は少し小さく */
.tm .big { font-family: var(--mono); font-size: 46px; font-size: 18.5cqw; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; text-shadow: 0 0 24px var(--tc); white-space: nowrap; }
.tm .big.long { font-size: 34px; font-size: 13.5cqw; }
.tm .big .s { color: var(--tc); }
.tm .sub { font-size: 12px; font-size: clamp(9px, 4.4cqw, 13px); color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm.paused .big { animation: blink 1.4s steps(1) infinite; }
.tm.urgent .big { color: #fff; animation: urg 1s ease-in-out infinite; }
@keyframes urg { 50% { transform: scale(1.04); text-shadow: 0 0 40px var(--tc); } }
.hero .nx { font-size: 13px; color: var(--muted); text-align: center; }
.hero .nx b { color: var(--fg); font-family: var(--mono); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--tc); opacity: 0.6; }
.dots i.on { background: var(--tc); opacity: 1; box-shadow: 0 0 8px var(--tc); }
.dots i.cur { animation: blinkbox 1.2s ease-in-out infinite; opacity: 1; }
.vs.timing > .week, .vs.timing > .big { display: none; }
.vs.timing { gap: 9px; }
/* 測っている間は、画面のまわりがゆっくり光る（勉強＝ピンク、休憩＝緑） */
#glow { position: fixed; inset: 0; z-index: 3; pointer-events: none; border-radius: 0; opacity: 0; transition: opacity 1.5s;
  box-shadow: inset 0 0 0 2px var(--gc, transparent), inset 0 0 90px var(--gc, transparent); }
#glow.on { opacity: 1; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.45; } }
/* 勉強 ⇄ 休憩 に切りかわったとき：画面いっぱいで知らせる */
.phase { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, color-mix(in srgb, var(--pc) 35%, transparent), rgba(0, 0, 0, 0.75) 70%);
  animation: phin 9s ease-out both; }
@keyframes phin { 0% { opacity: 0; } 4% { opacity: 1; } 8%, 16%, 24% { background-color: color-mix(in srgb, var(--pc) 40%, transparent); } 12%, 20% { background-color: transparent; } 85% { opacity: 1; } 100% { opacity: 0; } }
.phase .w { text-align: center; animation: zoomin 0.8s cubic-bezier(.2, 1.6, .4, 1) both; }
.phase .e { font-size: clamp(80px, 12vw, 160px); line-height: 1; filter: drop-shadow(0 0 30px var(--pc)); }
.phase .t { font-size: clamp(40px, 6vw, 84px); font-weight: 900; color: #fff; text-shadow: 0 0 30px var(--pc), 0 0 60px var(--pc); margin-top: 10px; }
.phase .u { font-size: clamp(18px, 2.2vw, 28px); color: #fff; opacity: 0.9; margin-top: 10px; font-weight: 700; }
@keyframes zoomin { from { transform: scale(0.3); opacity: 0; } }
.phase .rip { position: absolute; left: 50%; top: 50%; width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; border-radius: 50%; border: 3px solid var(--pc); animation: rip 2.2s ease-out infinite; }
.phase .rip.r2 { animation-delay: 0.7s; } .phase .rip.r3 { animation-delay: 1.4s; }
@keyframes rip { from { transform: scale(0.4); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }

/* 真ん中に大きく：いまの数字（進捗率・枚数など）や、お知らせ */
.spot { position: fixed; left: 50%; top: 46%; z-index: 55; width: min(680px, 86vw); transform: translate(-50%, -50%); pointer-events: none;
  padding: 18px 26px 20px; border-radius: 16px; background: rgba(6, 12, 30, 0.82); border: 1px solid rgba(95, 243, 255, 0.55);
  box-shadow: 0 0 0 1px rgba(95, 243, 255, 0.15), 0 0 60px rgba(95, 243, 255, 0.25), 0 30px 80px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: spot 6s cubic-bezier(.2, .9, .3, 1) both; overflow: hidden; }
.spot.big { border-color: var(--gold); box-shadow: 0 0 80px rgba(255, 213, 74, 0.45), 0 30px 80px rgba(0, 0, 0, 0.6); }
.spot::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; top: 0; background: var(--cy); box-shadow: 0 0 12px var(--cy); animation: scanin 0.9s ease-out both; }
@keyframes scanin { from { top: 0; } to { top: 100%; opacity: 0; } }
@keyframes spot { 0% { opacity: 0; transform: translate(-50%, -50%) scaleX(0.05); } 8% { opacity: 1; transform: translate(-50%, -50%) scaleX(1.02) scaleY(0.2); }
  14% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -54%) scale(0.98); } }
.spot .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em; color: var(--cy); display: flex; gap: 10px; }
.spot.big .k { color: var(--gold); }
.spot .k i { font-style: normal; color: var(--muted); }
.spot .m { font-size: clamp(22px, 2.8vw, 34px); font-weight: 800; margin-top: 8px; line-height: 1.35; min-height: 1.35em; }
.spot .m .cur { display: inline-block; width: 0.5em; height: 1em; background: var(--cy); vertical-align: -0.12em; margin-left: 3px; animation: blink 0.8s steps(1) infinite; }
.spot .s { margin-top: 6px; font-size: 14px; color: var(--muted); }
.spot .n { font-family: var(--mono); font-size: clamp(56px, 7vw, 92px); font-weight: 800; line-height: 1; margin-top: 10px; color: #fff; text-shadow: 0 0 30px rgba(95, 243, 255, 0.6); }
.spot .n small { font-size: 0.4em; color: var(--cy); margin-left: 4px; }
.spot .pb { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); margin-top: 12px; overflow: hidden; }
.spot .pb span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cy), #b38cff); box-shadow: 0 0 12px var(--cy); transition: width 1.6s cubic-bezier(.2, .8, .2, 1) 0.4s; }

/* はじめの画面・設定 */
.setup { position: relative; z-index: 3; max-width: 520px; margin: 4vh auto 0; padding: 24px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.setup h1 { margin: 0 0 6px; font-size: 24px; }
.setup p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.setup input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); color: var(--fg); }
.btn { font: inherit; font-weight: 800; font-size: 15px; padding: 11px 20px; border: none; border-radius: 999px; color: #04131a; background: var(--cy); margin-top: 12px; }
.btn.sub { background: rgba(255, 255, 255, 0.1); color: var(--fg); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: #ff9b9b; font-size: 13px; margin-top: 8px; }
.sheet { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; animation: fade 0.3s; }
@keyframes fade { from { opacity: 0; } }
.sheet .setup { margin: 0; }
.wake { position: fixed; z-index: 4; left: 50%; top: 10px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: rgba(95, 243, 255, 0.12); border: 1px solid var(--line); animation: fade 0.6s; transition: opacity 1s; }

/* 縦向き・小さい画面：時計の段は上に固定して、いつも見えるように */
@media (orientation: portrait), (max-width: 820px) {
  html, body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .top { position: sticky; top: 0; z-index: 10; margin: -14px -20px 0; padding: 12px 20px; background: rgba(4, 3, 15, 0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); flex-wrap: wrap; }
  .clock .hm { font-size: 64px; }
  .main { grid-template-columns: 1fr; }
  .vs { order: -1; }
}
.ready .panel, .ready .vs, .ready .it, .ready .wb i { animation-name: none; }
.ready .panel .sweep { animation-name: sweep; }
.ready .it.next .ck { animation-name: blinkbox; }
.ready .panel.flash { animation-name: pflash; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; transition-duration: 0.2s !important; }
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div class="lines"></div><div class="scan"></div></div>
<canvas id="sparks"></canvas>
<canvas id="fx"></canvas>
<div id="dim"></div>
<div id="glow"></div>
<div id="app"></div>
<script>
(function () {
  // スマホ用ページ（index.html）と同じ Supabase。公開してよい鍵で、ルームコードがないと読めない
  const SUPABASE_URL = "https://bioamywmjxiuzhlxlxcj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ZV-_zhWOiyQBoz6RXWXPlA_VGB7L8dV";
  const ROOM_KEY = "kira-mobile-room";  // スマホ用ページと同じ（同じ端末なら入れ直さなくていい）
  const ME_KEY = "kira-desk-me";
  const RING_KEY = "kira-desk-ring";  // 輪：goals＝毎日の目標 / plan＝今日の計画 / swap＝交互
  const STALE_SEC = 6 * 60;
  const W = ["日", "月", "火", "水", "木", "金", "土"];
  const WE = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}` : `${m}分`);
  const hmS = (m) => (m >= 60 ? `${Math.floor(m / 60)}<small>時間</small>${pad(m % 60)}` : `${m}<small>分</small>`);
  const hhmm = (ms) => { const d = new Date(ms); return `${d.getHours()}:${pad(d.getMinutes())}`; };
  const app = document.getElementById("app");
  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } },
  };
  const params = new URLSearchParams(location.search);
  const DEMO = params.get("rows");  // 確かめる用：ルームコードの代わりに、手元の JSON を読む
  let room = store.get(ROOM_KEY);
  let ringMode = store.get(RING_KEY) || "goals";
  let swapShow = "goals";  // 交互のときに、いま出しているほう
  let rows = [], fetchedAt = 0, error = "", prev = null, built = false, askedMe = false;

  function ankiToday() {
    const d = new Date(Date.now() - 4 * 3600 * 1000);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  async function load() {
    if (!room && !DEMO) return;
    try {
      const res = DEMO ? await fetch(DEMO, { cache: "no-store" }) : await fetch(
        `${SUPABASE_URL}/rest/v1/kira_scores?select=player,name,day,data,updated_at&order=day.desc&limit=40`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "x-kira-room": room } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      rows = await res.json();
      error = rows.length ? "" : "このルームコードの記録が見つかりません";
      fetchedAt = Date.now();
    } catch (e) {
      error = "読み込めませんでした（電波を確かめてください）";
    }
    render();
  }

  function players() {
    const by = {};
    rows.forEach((r) => { if (!by[r.player] || r.day > by[r.player].day) by[r.player] = r; });
    const ps = Object.values(by).sort((a, b) => String(a.name).localeCompare(String(b.name), "ja"));
    const me = store.get(ME_KEY);
    const i = ps.findIndex((p) => p.player === me);
    if (i > 0) ps.unshift(ps.splice(i, 1)[0]);
    return ps;
  }

  // いま勉強中か（アドオンの rnow.js と同じ考え方）
  function pomoPhase(p, t) {
    const work = p.work * 60, short = p.short * 60, long = p.long * 60, every = Math.max(1, p.every);
    const cycle = every * work + (every - 1) * short + long;
    const rounds = Math.floor(t / cycle), done = rounds * every;
    let rest = t - rounds * cycle;
    for (let i = 0; i < every; i++) {
      if (rest < work) return { phase: "work", count: done + i + 1, left: work - rest };
      rest -= work;
      const brk = i === every - 1 ? long : short;
      if (rest < brk) return { phase: "break", count: done + i + 1, left: brk - rest };
      rest -= brk;
    }
    return { phase: "work", count: done + every + 1, left: work };
  }
  function status(r) {
    const d = r.data || {};
    const nowMs = Date.now(), age = Math.max(0, d.sentAt ? (nowMs - d.sentAt) / 1000 : 1e9);
    const n = d.now, L = d.last || {}, m = (sec) => Math.max(0, Math.round(sec / 60));
    const la = L.answer || 0, anki = la && nowMs - la < 5 * 60 * 1000;
    const ankiWhat = L.subject ? esc(L.subject + (L.part ? `（${L.part}）` : "")) : "";
    if (n && age < STALE_SEC) {
      const what = esc((n.subject || "") + (n.kind ? "・" + n.kind : ""));
      const act = (n.active || 0) + (n.paused ? 0 : age);
      if (n.paused) return { cls: "pause", on: false, html: `⏸ ひと休み中 <small>${what}・ここまで${hm(m(act))}</small>` };
      if (n.mode === "pomodoro" && n.pomo) {
        const ph = pomoPhase(n.pomo, act);
        return ph.phase === "work"
          ? { cls: "on", on: true, html: `<i class="dot"></i>🍅 勉強中 <small>${what}・${ph.count}回目 のこり${m(ph.left)}分</small>` }
          : { cls: "brk", on: false, html: `☕ 休憩中 <small>あと${m(ph.left)}分</small>` };
      }
      if (n.mode === "timer" && n.target) return { cls: "on", on: true, html: `<i class="dot"></i>⏳ 勉強中 <small>${what}・のこり${m(n.target - act)}分</small>` };
      return { cls: "on", on: true, html: `<i class="dot"></i>⏱ 勉強中 <small>${what}・${hm(m(act))}</small>` };
    }
    if (anki) return { cls: "on", on: true, html: `<i class="dot"></i>📘 Anki で解いている <small>${ankiWhat}</small>` };
    const ts = Math.max(la, (L.study || 0) * 1000);
    if (ts && r.day === ankiToday()) {
      const ago = m((nowMs - ts) / 1000);
      return { cls: "off", on: false, html: `💤 最後の勉強 ${hhmm(ts)} <small>${ago < 60 ? ago + "分" : Math.floor(ago / 60) + "時間"}前</small>` };
    }
    return { cls: "off", on: false, html: "💤 今日はまだ勉強していません" };
  }

  // ⏱ いま測っている時間（自分の分）。Anki から届いた「ここまでの時間」と「送った時刻」から、毎秒ここで進める
  function timerState(r) {
    if (!r || r.day !== ankiToday()) return null;
    const d = r.data || {}, n = d.now;
    if (!n) return null;
    const age = Math.max(0, (Date.now() - (d.sentAt || 0)) / 1000);
    if (age > (n.paused ? 3600 : STALE_SEC)) return null;  // 届かなくなった（Anki を閉じた）
    const act = (n.active || 0) + (n.paused ? 0 : age);
    const st = { mode: n.mode, paused: !!n.paused, act, subject: n.subject || "", kind: n.kind || "" };
    if (n.mode === "pomodoro" && n.pomo) {
      const p = n.pomo, ph = pomoPhase(p, act), every = Math.max(1, p.every);
      const isLong = ph.phase === "break" && ph.count % every === 0;
      const len = (ph.phase === "work" ? p.work : isLong ? p.long : p.short) * 60;
      return { ...st, phase: ph.phase, long: isLong, count: ph.count, every, left: ph.left, len, key: `p|${ph.phase}|${ph.count}`,
        nextLen: ph.phase === "work" ? ((ph.count % every === 0 ? p.long : p.short) * 60) : p.work * 60 };
    }
    if (n.mode === "timer" && n.target) {
      const left = n.target - act;
      return { ...st, phase: left > 0 ? "timer" : "over", left, len: n.target, key: `t|${left > 0 ? "run" : "over"}` };
    }
    return { ...st, phase: "sw", key: "sw" };
  }
  const TCOL = { work: "#ff4fa0", break: "#3ddc84", timer: "#5ff3ff", over: "#ffb400", sw: "#5ff3ff", pause: "#ffb400" };
  const clk = (sec) => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
    return h ? `${h}:${pad(m)}<span class="s">:${pad(x)}</span>` : `${pad(m)}<span class="s">:${pad(x)}</span>`; };
  function heroHtml() {
    return `<div class="hero" id="hero"><div class="hk" id="tmK"></div>
      <div class="tm" id="tm"><svg viewBox="0 0 100 100"><circle class="o1" cx="50" cy="50" r="49"/><circle class="o2" cx="50" cy="50" r="49"/>
        <circle class="bg" cx="50" cy="50" r="43"/><circle class="pg" id="tmP" cx="50" cy="50" r="43" stroke-dasharray="270.2" stroke-dashoffset="270.2"/></svg>
        <div class="ct"><div class="ph" id="tmPh"></div><div class="big" id="tmB"></div><div class="sub" id="tmS"></div></div></div>
      <div class="dots" id="tmD"></div><div class="nx" id="tmN"></div></div>`;
  }
  let lastTimerKey = null, heroOn = false;
  function tickTimer() {
    const me = players()[0];
    const st = timerState(me);
    if (!!st !== heroOn && built) { render(); return; }  // 始めた・やめた：真ん中の作りを変える
    const glow = document.getElementById("glow");
    if (!st) { glow.classList.remove("on"); lastTimerKey = null; return; }
    const col = st.paused ? TCOL.pause : TCOL[st.phase];
    const hero = document.getElementById("hero");
    if (hero) {
      hero.style.setProperty("--tc", col);
      const tm = document.getElementById("tm");
      tm.classList.toggle("paused", st.paused);
      tm.classList.toggle("urgent", (st.phase === "work" || st.phase === "timer") && st.left != null && st.left <= 60 && !st.paused);
      const label = { work: `🍅 集中 ${st.count}回目`, break: st.long ? "🛋 長い休憩" : "☕ 休憩", timer: "⏳ タイマー", over: "⏳ 時間です", sw: "⏱ ストップウォッチ" }[st.phase];
      document.getElementById("tmK").textContent = st.paused ? "// PAUSED" : st.phase === "break" ? "// BREAK TIME" : st.phase === "over" ? "// TIME UP" : "// FOCUS MODE";
      document.getElementById("tmPh").textContent = (st.paused ? "⏸ 一時停止中 ・ " : "") + label;
      const big = st.phase === "sw" ? st.act : st.phase === "over" ? -st.left : st.left;
      const bEl = document.getElementById("tmB");
      bEl.innerHTML = (st.phase === "over" ? "+" : "") + clk(big);
      bEl.classList.toggle("long", big >= 3600 || st.phase === "over");
      document.getElementById("tmS").textContent = [st.subject, st.kind].filter(Boolean).join("・");
      // 輪：ポモドーロ・タイマー＝この区切りの進み、ストップウォッチ＝1時間で1周
      const frac = st.len ? Math.min(1, Math.max(0, 1 - st.left / st.len)) : (st.act % 3600) / 3600;
      document.getElementById("tmP").style.strokeDashoffset = (270.2 * (1 - frac)).toFixed(1);
      document.getElementById("tmD").innerHTML = st.mode === "pomodoro" ? Array.from({ length: st.every }, (_, i) => {
        const k = (st.count - 1) % st.every;
        return `<i class="${i < k || (i === k && st.phase === "break") ? "on" : i === k ? "cur" : ""}"></i>`; }).join("") : "";
      const nx = st.mode === "pomodoro" ? (st.phase === "work" ? `あと <b>${clk(st.left).replace(/<[^>]+>/g, "")}</b> で ${st.count % st.every === 0 ? "長い休憩" : "休憩"}（${Math.round(st.nextLen / 60)}分）`
        : `あと <b>${clk(st.left).replace(/<[^>]+>/g, "")}</b> で 集中 ${st.count + 1}回目（${Math.round(st.nextLen / 60)}分）`)
        : st.phase === "timer" ? `${Math.round(st.len / 60)}分のタイマー` : st.phase === "over" ? `${Math.round(st.len / 60)}分を過ぎました` : "測っています";
      document.getElementById("tmN").innerHTML = nx;
    }
    glow.style.setProperty("--gc", col);
    glow.classList.add("on");
    // 切りかわり（勉強 ⇄ 休憩・時間になった）は、画面いっぱいで知らせる
    if (lastTimerKey && st.key !== lastTimerKey && !st.paused) {
      if (st.phase === "work") phaseAlert("🍅", `集中 ${st.count}回目 スタート`, `${Math.round(st.len / 60)}分、がんばろう`, TCOL.work, "work");
      else if (st.phase === "break") phaseAlert(st.long ? "🛋" : "☕", st.long ? "長い休憩" : "休憩タイム", `${Math.round(st.len / 60)}分 休もう。目を休めて、水を飲もう`, TCOL.break, "break");
      else if (st.phase === "over") phaseAlert("⏳", "時間です！", `${Math.round(st.len / 60)}分 おつかれさま`, TCOL.over, "over");
    }
    lastTimerKey = st.key;
  }
  function phaseAlert(e, t, u, color, kind) {
    document.querySelectorAll(".phase").forEach((x) => x.remove());
    const el = document.createElement("div");
    el.className = "phase";
    el.style.setProperty("--pc", color);
    el.innerHTML = `<i class="rip"></i><i class="rip r2"></i><i class="rip r3"></i><div class="w"><div class="e">${e}</div><div class="t">${esc(t)}</div><div class="u">${esc(u)}</div></div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 9000);
    burst(kind === "break" ? 160 : 220);
    chime(kind);
  }
  // 音（一度画面を押したあとだけ鳴らせる。ブラウザの決まり）
  let actx = null;
  function unlockAudio() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { actx = null; }
  }
  function chime(kind) {
    if (!actx || store.get("kira-desk-sound") === "off") return;
    const notes = kind === "break" ? [784, 659, 523] : kind === "over" ? [880, 880, 880, 1047] : [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.18;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1);
    });
  }

  // 一番乗りボーナス（アドオンの battle.py と同じ決まり。2026-11-16 から目標の大きさで重みづけ）
  const GOAL_MIN = { new: 1, focus_all: 1 / 3, reviews_all: 1 / 3, rest_reviews: 1 / 3, review: 1 / 3, chapters: 1 / 3, total: 0.25, minutes: 1 };
  function goalSize(d) {
    const gs = d.goals || [];
    if (!gs.length) return null;
    let t = 0;
    for (const g of gs) { const w = GOAL_MIN[g.type]; if (w == null) return null; t += (Number(g.target) || 0) * w; }
    return t;
  }
  function firstBonus(a, b) {
    const da = a.allDoneAt, db = b.allDoneAt;
    const pts = (f, o) => {
      const day = f.day || o.day || "";
      if (!day || day < "2026-11-16") return 20;
      const x = goalSize(f), y = goalSize(o);
      return x && y ? Math.round(20 * Math.min(1, x / y)) : 20;
    };
    if (da && (!db || da < db)) return [pts(a, b), 0];
    if (db && (!da || db < da)) return [0, pts(b, a)];
    return [0, 0];
  }
  const base = (d) => d && d.score ? (d.score.total || 0) - (d.score.first || 0) : 0;

  // 背景の色（ホームと同じく時間帯で）
  function theme() {
    const h = new Date().getHours();
    const t = h >= 5 && h < 10 ? ["#ff7a8b", "#c03aa0", "#ffb36e", "#0d0614"] : h >= 10 && h < 17 ? ["#2f6dff", "#7b4dff", "#13c9a0", "#040a1f"]
      : h >= 17 && h < 20 ? ["#e0507a", "#6a2cff", "#ffa04a", "#0e0518"] : ["#3b2fb5", "#6d28d9", "#0ea5e9", "#04030f"];
    const s = document.documentElement.style;
    s.setProperty("--a", t[0]); s.setProperty("--b", t[1]); s.setProperty("--c", t[2]); s.setProperty("--bg", t[3]);
    document.getElementById("dim").style.opacity = h >= 1 && h < 5 ? 0.55 : 0;  // 夜中（1〜5時）は暗く
  }

  // 数字をなめらかに変える。得点が変わったら点滅して「+12」を出す
  const shown = {};
  function countTo(el, to, bump) {
    if (!el) return;
    const key = el.id, from = shown[key] == null ? 0 : shown[key];
    const first = shown[key] == null;
    shown[key] = to;
    if (from === to) { el.textContent = to; return; }
    if (bump && !first) {
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      const d = document.createElement("span");
      d.className = "delta" + (to < from ? " minus" : "");
      d.textContent = (to > from ? "+" : "") + (to - from);
      el.parentNode.appendChild(d);
      setTimeout(() => d.remove(), 2300);
      const p = el.closest(".panel");
      if (p) { p.classList.remove("flash"); void p.offsetWidth; p.classList.add("flash"); }
      if (to > from) burstAt(el, Math.min(90, 20 + (to - from) * 3));
    }
    const t0 = performance.now(), dur = 1400;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // 描き直しても、輪やバーは前の位置から動かす（30秒ごとの更新で0から伸び直さないように）
  const lastPos = {};
  function ring(id, pct, color, big, small, label, done) {
    const r = 42, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, Math.max(0, pct)) / 100);
    const from = lastPos[id] != null ? lastPos[id] : c;
    return `<div class="ring ${done ? "done" : ""}" style="--rc:${color}"><svg viewBox="0 0 100 100"><circle class="orb" cx="50" cy="50" r="49"/><circle class="tr" cx="50" cy="50" r="${r}"/>
      <circle class="pr" id="${id}" cx="50" cy="50" r="${r}" stroke="${color}" stroke-dasharray="${c.toFixed(1)}" style="stroke-dashoffset:${Number(from).toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>
      <div class="in"><b class="num">${done ? "✓" : big}</b><small>${small}</small><i>${Math.round(pct)}%</i></div><div class="lb">${label}</div></div>`;
  }

  // 輪の中身：毎日の目標 ／ 今日の計画（アドオンの「今日の計画の輪」と同じ）
  function ringItems(d, mode) {
    if (mode === "plan") {
      if (d.planRings && d.planRings.length) return d.planRings;
      const items = d.plan && d.plan.items ? d.plan.items : [];  // 古い版のアドオン：項目の数だけ
      if (!items.length) return [];
      const done = items.filter((x) => x.done).length;
      return [{ name: "計画の項目", value: done, target: items.length, unit: "件", pct: Math.round((done * 100) / items.length), done: done === items.length }];
    }
    return (d.goals || []).map((g) => ({ name: g.name, value: g.value, target: g.target, unit: g.unit || "", pct: g.pct, done: g.done }));
  }
  const curMode = () => (ringMode === "swap" ? swapShow : ringMode);

  function ringsHtml(r, side) {
    const d = r.day === ankiToday() ? r.data || {} : {};
    const mode = curMode();
    let items = ringItems(d, mode), shownMode = mode;
    if (!items.length && mode === "plan") { items = ringItems(d, "goals"); shownMode = "goals"; }
    if (!items.length) return "";
    const colors = shownMode === "plan" ? ["#4fa3ff", "#3ddc84", "#ffb400"] : ["#3ddc84", "#4fa3ff", "#ffb400", "#b38cff"];
    return `<div class="ringsbox"><span class="mode">${shownMode === "plan" ? "// TODAY'S PLAN" : "// DAILY GOALS"}</span><div class="rings" data-mode="${shownMode}">${items.slice(0, 3).map((g, i) =>
      ring(`${side}-${shownMode}${i}`, g.pct, colors[i % colors.length], g.value == null ? "—" : g.value, `/${esc(g.target)}${esc(g.unit || "")}`, esc(g.name), g.done)).join("")}</div></div>`;
  }

  function panel(r, side) {
    const d = r.data || {}, today = r.day === ankiToday();
    const st = status(r);
    const plan = today && d.plan && d.plan.items ? d.plan.items : [];
    const next = plan.find((x) => !x.done);
    const planHtml = plan.length ? plan.map((x, i) => `<div class="it ${x.done ? "done" : ""} ${x === next ? "next" : ""}" style="animation-delay:${0.25 + i * 0.06}s">
        <span class="ck">${x.done ? "✓" : ""}</span><span class="t">${esc(x.label)}</span>
        <span class="r">${x.done ? (x.doneAt ? hhmm(x.doneAt * 1000) : "") : x.left != null ? `${x.left}枚` : ""}</span></div>`).join("")
      : '<div class="empty">今日の勉強計画はまだありません</div>';
    const done = plan.filter((x) => x.done).length;
    const min = d.timeline && d.timeline.ankiMin != null ? d.timeline.ankiMin : d.minutes || 0;
    return `<section class="panel ${side}"><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i><i class="sweep"></i>
      <div class="who"><div><div class="tag">${side === "me" ? "PLAYER 01" : "PLAYER 02"}</div><span class="name">${esc(r.name)}</span></div>
        <span class="score"><b class="num" id="${side}-sc">0</b><small>今日のスコア</small></span></div>
      <div class="state ${st.cls}">${today ? st.html : `💤 今日の記録はまだ届いていません`}</div>
      <div id="${side}-rings">${today ? ringsHtml(r, side) : ""}</div>
      <div class="stats"><div><span>新規</span><b class="num">${today ? d.newCards ?? "—" : "—"}</b></div><div><span>復習</span><b class="num">${today ? d.reviewed ?? "—" : "—"}</b></div>
        <div><span>Anki</span><b class="num">${today ? hmS(min) : "—"}</b></div><div><span>連続</span><b class="num">${d.streak != null ? d.streak + "<small>日</small>" : "—"}</b></div></div>
      <div class="plan"><h3>📋 今日の勉強計画 ${plan.length ? `<b class="mono">${done}/${plan.length}</b>` : ""}<span>${today && d.plan && d.plan.leftMin ? `のこり約${hm(d.plan.leftMin)}・${esc(d.plan.finishAt)}ごろ` : ""}</span></h3>
        <div class="list">${planHtml}</div></div>
    </section>`;
  }

  // この7日のスコア（それぞれの日の勝ち負けも）
  function weekHtml(me, rv) {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(Date.now() - 4 * 3600 * 1000 - i * 86400000);
      days.push({ iso: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, w: W[d.getDay()] });
    }
    const find = (p, iso) => rows.find((r) => r.player === p.player && r.day === iso);
    let wa = 0, wb = 0;
    const vals = days.map(({ iso, w }) => {
      const a = find(me, iso), b = find(rv, iso);
      const ad = (a && a.data) || {}, bd = (b && b.data) || {};
      const [fa, fb] = a && b ? firstBonus(ad, bd) : [0, 0];
      const x = a ? base(ad) + fa : null, y = b ? base(bd) + fb : null;
      if (iso < ankiToday() && x != null && y != null) { if (x > y) wa++; else if (y > x) wb++; }
      return { w, x, y, today: iso === ankiToday() };
    });
    const mx = Math.max(1, ...vals.flatMap((v) => [v.x || 0, v.y || 0]));
    return `<div class="week"><div class="sec-t">LAST 7 DAYS　<b style="color:var(--me)">${wa}</b> − <b style="color:var(--rv)">${wb}</b></div>
      <div class="wk">${vals.map((v, i) => `<div class="wd ${v.today ? "today" : ""}"><div class="wb">
          <i class="a" style="--h:${((v.x || 0) * 100) / mx}%;animation-delay:${0.3 + i * 0.07}s"></i><i class="b" style="--h:${((v.y || 0) * 100) / mx}%;animation-delay:${0.35 + i * 0.07}s"></i></div>
          <span>${v.w}</span></div>`).join("")}</div></div>`;
  }

  function vsPanel(me, rv) {
    const md = (me && me.day === ankiToday() && me.data) || {}, rd = (rv && rv.day === ankiToday() && rv.data) || {};
    const [fa, fb] = rv ? firstBonus(md, rd) : [0, 0];
    const a = base(md) + fa, b = base(rd) + fb;
    const diff = a - b, share = a + b ? (a * 100) / (a + b) : 50;
    const lead = !rv ? "" : diff > 0 ? `🔥 ${esc(me.name)} が ${diff}点リード` : diff < 0 ? `🔥 ${esc(rv.name)} が ${-diff}点リード` : "⚔ 同点";
    const firstTxt = md.allDoneAt && (!rd.allDoneAt || md.allDoneAt < rd.allDoneAt) ? `🥇 ${esc(me.name)} が一番乗り（+${fa}）`
      : rd.allDoneAt ? `🥇 ${esc(rv.name)} が一番乗り（+${fb}）` : "🏁 先に目標を全部終えたほうに 最大 +20";
    const maps = [me, rv].filter((p) => p && p.data && p.data.map);
    const mapHtml = maps.map((p, i) => `<div class="mp"><span>${esc(p.name)}</span><div class="bar"><span id="mp${i}" data-w="${p.data.map.pct}"
        style="width:${lastPos["mp" + i] || 0}%;background:linear-gradient(90deg,${i ? "var(--rv),var(--rv2)" : "var(--me),var(--me2)"})"></span></div><b>${p.data.map.pct}%</b></div>`).join("");
    const timing = !!timerState(me);
    heroOn = timing;
    return { a, b, html: `<section class="vs ${timing ? "timing" : ""}"><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      ${timing ? heroHtml() : ""}
      <div class="big">VS</div>
      <div class="tug"><span id="tug" style="width:${lastPos.tug != null ? lastPos.tug : 50}%" data-w="${share.toFixed(1)}"></span></div>
      <div class="lead">${lead}<small>${rv ? `${a} − ${b}` : ""}</small></div>
      ${rv ? `<div class="first">${firstTxt}</div>` : ""}
      ${rv ? weekHtml(me, rv) : ""}
      ${maps.length ? `<div class="maps"><div class="sec-t">PROGRESS</div>${mapHtml}</div>` : ""}
    </section>` };
  }

  // 試験まで：日＋時:分:秒（試験の初日の 0時まで）
  let examInfo = null;
  function examHtml(ps) {
    examInfo = ps.map((p) => p.data && p.data.exam).find(Boolean) || null;
    if (!examInfo) return "";
    return `<div class="exam" id="examBox"><div class="l">⏳ ${esc(examInfo.name)}${examInfo.inPeriod ? "　おわりまで" : "　まで"}</div>
      <div class="cd"><span class="dd num" id="exD"></span><span class="hms" id="exT"></span></div><div class="bar"><span id="exBar"></span></div></div>`;
  }
  function tickExam() {
    if (!examInfo) return;
    const target = new Date((examInfo.inPeriod ? examInfo.end : examInfo.start) + "T00:00:00");
    if (examInfo.inPeriod) target.setDate(target.getDate() + 1);
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const dEl = document.getElementById("exD"), tEl = document.getElementById("exT"), box = document.getElementById("examBox"), bar = document.getElementById("exBar");
    if (!dEl) return;
    dEl.innerHTML = `${d}<small>日</small>`;
    tEl.innerHTML = `${pad(h)}:${pad(m)}<span class="ms">:${pad(s)}</span>`;
    box.classList.toggle("hot", d < 14 || examInfo.inPeriod);
    // 今日がどれだけ過ぎたか（1日のうちの残り）
    bar.style.width = `${(((h * 3600 + m * 60 + s) / 86400) * 100).toFixed(2)}%`;
  }

  function ticker(ps) {
    const items = tlItems(ps);
    if (!items.length) return "";
    const html = items.slice(-14).map((x) => `<span><b>${esc(x.when)}</b><span class="w">${esc(x.who)}</span>${esc(x.icon)} ${esc(x.text)}</span>`).join("");
    return `<div class="ticker"><div class="tr" style="animation-duration:${Math.max(40, items.length * 7)}s">${html}</div></div>`;
  }
  function tlItems(ps) {
    const items = [];
    ps.forEach((p) => {
      const t = p.day === ankiToday() && p.data && p.data.timeline ? p.data.timeline.items || [] : [];
      t.slice(-10).forEach((x) => items.push({ when: x.when, who: p.name, icon: x.icon, text: x.text, strong: x.strong, key: `${p.player}|${x.when}|${x.text}` }));
    });
    return items.sort((a, b) => (String(a.when) > String(b.when) ? 1 : -1));
  }

  // 真ん中に大きく出す（流れている記録を、ときどき大きく。新しいお知らせは、すぐに）
  let spotBusy = false;
  const spotQueue = [];
  function spotlight(kind, msg, sub, big, extra) {
    spotQueue.push({ kind, msg, sub, big, ...(extra || {}) });
    if (!spotBusy) nextSpot();
  }
  function nextSpot() {
    const x = spotQueue.shift();
    if (!x) { spotBusy = false; return; }
    spotBusy = true;
    const el = document.createElement("div");
    el.className = "spot" + (x.big ? " big" : "");
    const now = new Date();
    el.innerHTML = `<div class="k"><span>${x.kind}</span><i>${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</i></div><div class="m"><span class="tx"></span><span class="cur"></span></div>`
      + (x.num != null ? `<div class="n"><span class="nv">0</span><small>${esc(x.unit || "")}</small></div>` : "")
      + (x.pct != null ? `<div class="pb"><span></span></div>` : "")
      + (x.sub ? `<div class="s">${x.sub}</div>` : "");
    if (heroOn) el.style.top = "80%";  // 測っている間は、タイマーにかぶらないよう下に出す
    document.body.appendChild(el);
    if (x.num != null) {  // 数字は 0 から数え上げる
      const nv = el.querySelector(".nv"), dec = String(x.num).includes(".") ? 1 : 0, t0 = performance.now();
      const step = (t) => { const k = Math.min(1, (t - t0) / 1300), e = 1 - Math.pow(1 - k, 3);
        nv.textContent = (x.num * e).toLocaleString("ja-JP", { minimumFractionDigits: dec, maximumFractionDigits: dec }); if (k < 1) requestAnimationFrame(step); };
      setTimeout(() => requestAnimationFrame(step), 300);
    }
    if (x.pct != null) requestAnimationFrame(() => requestAnimationFrame(() => { el.querySelector(".pb span").style.width = Math.min(100, x.pct) + "%"; }));
    // 1文字ずつ打ち出す
    const tx = el.querySelector(".tx"), chars = [...x.msg];
    let i = 0;
    const typer = setInterval(() => { tx.textContent = chars.slice(0, ++i).join(""); if (i >= chars.length) clearInterval(typer); }, 34);
    if (x.big) burst(220);
    setTimeout(() => { el.remove(); setTimeout(nextSpot, 600); }, 6000);
  }
  // 自分のいまの数字を、順番に真ん中に大きく出す（いま勉強している科目の進捗率・今日の枚数・計画の残り など）
  let spotIdx = 0;
  function insights(r) {
    if (!r || r.day !== ankiToday()) return [];
    const d = r.data || {}, out = [];
    const subj = (d.now && d.now.subject) || (d.last && d.last.subject) || "";
    const areas = d.map && d.map.areas || [];
    const a = areas.find((x) => x.name === subj) || areas.filter((x) => x.pct < 100).sort((x, y) => y.pct - x.pct)[0];
    if (a) out.push({ kind: "// SUBJECT PROGRESS", msg: `📘 ${a.name} の進捗率`, num: a.pct, unit: "%", pct: a.pct, sub: `${a.done.toLocaleString()} / ${a.total.toLocaleString()}枚 ・ のこり ${(a.total - a.done).toLocaleString()}枚` });
    if (d.map) out.push({ kind: "// TOTAL PROGRESS", msg: "📈 全体の進捗率", num: d.map.pct, unit: "%", pct: d.map.pct, sub: `${d.map.done.toLocaleString()} / ${d.map.total.toLocaleString()}枚 ・ 新規のこり ${(d.map.total - d.map.done).toLocaleString()}枚` });
    const min = d.timeline && d.timeline.ankiMin != null ? d.timeline.ankiMin : d.minutes || 0;
    out.push({ kind: "// TODAY", msg: "🃏 今日 解いたカード", num: (d.newCards || 0) + (d.reviewed || 0), unit: "枚", sub: `新規 ${d.newCards || 0}枚 ・ 復習 ${d.reviewed || 0}枚 ・ Anki ${hm(min)}` });
    (d.goals || []).forEach((g) => out.push({ kind: "// DAILY GOAL", msg: `🎯 ${g.name}`, num: g.value || 0, unit: `/ ${g.target}${g.unit || ""}`, pct: g.pct, sub: g.done ? "✅ 達成！" : `あと ${Math.max(0, g.target - (g.value || 0))}${g.unit || ""}` }));
    const items = d.plan && d.plan.items || [], next = items.find((x) => !x.done);
    if (items.length) out.push({ kind: "// TODAY'S PLAN", msg: next ? `📋 次は ${next.label}` : "📋 今日の計画、ぜんぶ終わり！", num: items.filter((x) => x.done).length, unit: `/ ${items.length}件`,
      pct: (items.filter((x) => x.done).length * 100) / items.length, sub: d.plan.leftMin ? `のこり約${hm(d.plan.leftMin)} ・ ${esc(d.plan.finishAt)}ごろ終わる` : "" });
    if (d.exam && d.map && !d.exam.inPeriod && d.exam.daysTo > 0) {
      const left = d.map.total - d.map.done;
      if (left > 0) out.push({ kind: "// EXAM PACE", msg: `⏳ ${d.exam.name}までに新規を終えるには`, num: Math.ceil(left / d.exam.daysTo), unit: "枚/日", sub: `のこり ${left.toLocaleString()}枚 ÷ ${d.exam.daysTo}日` });
    }
    const low = (d.balance && d.balance.rows || []).slice().sort((x, y) => x.pct - y.pct)[0];
    if (low) out.push({ kind: "// MEMORY", msg: `🧠 ${low.name} の覚えている割合`, num: low.pct, unit: "%", pct: low.pct, sub: `期限 ${low.due}枚 ・ この7日の復習 ${low.rev7}枚` });
    if (d.streak) out.push({ kind: "// STREAK", msg: "🔥 続けて勉強した日", num: d.streak, unit: "日" });
    return out;
  }
  function insightSpot() {
    if (spotBusy || !built) return;
    const xs = insights(players()[0]);
    if (!xs.length) return;
    const x = xs[(spotIdx++) % xs.length];
    spotlight(x.kind, x.msg, x.sub, false, { num: x.num, unit: x.unit, pct: x.pct });
  }

  // 時計
  let lastHM = "";
  function tickClock() {
    const d = new Date();
    const h = String(d.getHours()), m = pad(d.getMinutes()), s = d.getSeconds();
    const el = document.getElementById("hm");
    if (el) {
      const cur = h + ":" + m;
      if (cur !== lastHM) {
        const digs = (h + m).split("");
        const old = lastHM.replace(":", "").padStart(digs.length, " ").split("");
        const dig = (c, i) => `<span class="dig ${lastHM && old[i] !== c ? "flip" : ""}">${c}</span>`;
        el.innerHTML = `${digs.slice(0, h.length).map((c, i) => dig(c, i)).join("")}<span class="colon">:</span>${digs.slice(h.length).map((c, i) => dig(c, h.length + i)).join("")}`;
        lastHM = cur;
        const dt = document.getElementById("date");
        if (dt) dt.innerHTML = `<div class="d">${d.getMonth() + 1}月${d.getDate()}日（${W[d.getDay()]}）</div><div class="w">${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${WE[d.getDay()]}</div>`;
        theme();
      }
    }
    const se = document.getElementById("sec"), sp = document.getElementById("secp");
    if (se) se.textContent = pad(s);
    if (sp) { const c = 2 * Math.PI * 46; sp.style.transition = s === 0 ? "none" : ""; sp.style.strokeDashoffset = (c * (1 - s / 60)).toFixed(1); }
    tickExam();
  }
  function headerHtml() {
    const c = (2 * Math.PI * 46).toFixed(1);
    return `<header class="top">
      <div class="clockbox"><div class="secring"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="46"/><circle class="p" id="secp" cx="50" cy="50" r="46" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg>
        <div class="ticks"></div><div class="s" id="sec"></div></div>
        <div class="clock"><span class="hm num" id="hm"></span></div></div>
      <div class="date" id="date"></div><div class="grow"></div><div id="exam"></div>
      <div class="tools"><button class="iconbtn" id="gear" aria-label="設定">⚙</button>
        <div class="seg" id="ringseg">${[["goals", "🎯 目標"], ["plan", "📋 計画"], ["swap", "🔄 交互"]].map(([k, l]) => `<button data-ring="${k}" class="${ringMode === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
    </header>`;
  }
  function bindHeader() {
    document.getElementById("gear").onclick = (e) => { e.stopPropagation(); settings(); };
    document.querySelectorAll("[data-ring]").forEach((b) => (b.onclick = (e) => {
      e.stopPropagation();
      ringMode = b.dataset.ring; store.set(RING_KEY, ringMode);
      if (ringMode !== "swap") swapShow = ringMode;
      document.querySelectorAll("[data-ring]").forEach((x) => x.classList.toggle("on", x.dataset.ring === ringMode));
      redrawRings();
    }));
  }
  function redrawRings() {
    const ps = players();
    [["me", ps[0]], ["rv", ps[1]]].forEach(([side, r]) => {
      const box = document.getElementById(`${side}-rings`);
      if (box && r && r.day === ankiToday()) box.innerHTML = ringsHtml(r, side);
    });
    animateBars();
  }

  // 変わったところで、真ん中に大きくお知らせ（相手が項目を終えた・目標を達成した など）
  function celebrate(ps) {
    const snap = {};
    ps.forEach((p) => {
      const d = p.day === ankiToday() ? p.data || {} : {};
      snap[p.player] = { name: p.name, done: (d.plan && d.plan.items || []).filter((x) => x.done).map((x) => x.label), all: !!d.allDoneAt,
        goals: (d.goals || []).filter((g) => g.done).map((g) => g.name), on: status(p).on, tl: tlItems([p]).map((x) => x.key) };
    });
    if (prev) {
      Object.entries(snap).forEach(([id, s]) => {
        const o = prev[id];
        if (!o) return;
        if (s.all && !o.all) { spotlight("// ALL CLEAR", `👑 ${s.name} が今日の目標を全部クリア！`, "", true); return; }
        const g = s.goals.find((x) => !o.goals.includes(x));
        if (g) { spotlight("// GOAL", `🎯 ${s.name}「${g}」達成！`, "", true); return; }
        const it = s.done.find((x) => !o.done.includes(x));
        if (it) { spotlight("// TASK DONE", `✅ ${s.name} が終えた`, esc(it), false); burst(70); return; }
        if (s.on && !o.on && id !== (ps[0] && ps[0].player)) spotlight("// STATUS", `📘 ${s.name} が勉強を始めた`, "", false);
      });
    }
    prev = snap;
  }

  // 紙吹雪
  const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
  let parts = [], fxOn = false;
  const COLS = ["#ff4fa0", "#ffb400", "#3f9dff", "#5ff3ff", "#b38cff", "#fff"];
  function burst(n, x, y) {
    for (let i = 0; i < n; i++) {
      parts.push({ x: (x ?? innerWidth / 2) + (Math.random() - 0.5) * 120, y: y ?? innerHeight * 0.32, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 3,
        r: Math.random() * 6 + 3, c: COLS[i % COLS.length], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, life: 1 });
    }
    if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
  }
  function burstAt(el, n) { const b = el.getBoundingClientRect(); burst(n, b.left + b.width / 2, b.top + b.height / 2); }
  function fxLoop() {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach((p) => {
      p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= 0.007;
      fctx.save(); fctx.globalAlpha = Math.max(0, p.life); fctx.translate(p.x, p.y); fctx.rotate(p.a);
      fctx.fillStyle = p.c; fctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); fctx.restore();
    });
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // 光の粒（背景）
  const sp = document.getElementById("sparks"), sctx = sp.getContext("2d");
  let dots = [];
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    [sp, fx].forEach((c) => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px"; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); });
    dots = Array.from({ length: Math.round((innerWidth * innerHeight) / 24000) }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.5 + 0.3, v: Math.random() * 0.25 + 0.05, p: Math.random() * 6, c: Math.random() < 0.3 }));
  }
  let lastT = 0;
  function sparkLoop(t) {
    if (t - lastT > 33) {  // 30fps くらいで十分（電池のため）
      lastT = t;
      sctx.clearRect(0, 0, innerWidth, innerHeight);
      dots.forEach((d) => {
        d.y -= d.v; d.p += 0.02;
        if (d.y < -4) { d.y = innerHeight + 4; d.x = Math.random() * innerWidth; }
        sctx.globalAlpha = 0.2 + 0.4 * Math.sin(d.p) ** 2;
        sctx.fillStyle = d.c ? "#5ff3ff" : "#fff";
        sctx.beginPath(); sctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); sctx.fill();
      });
    }
    requestAnimationFrame(sparkLoop);
  }

  // 画面をつけたままにする（対応している端末だけ）
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") { wakeLock = await navigator.wakeLock.request("screen"); } } catch (e) { wakeLock = null; }
    const w = document.getElementById("wake");
    if (w) w.remove();
  }

  // はじめの画面（時計はここでも出す）
  function setup(msg) {
    built = false;
    app.innerHTML = headerHtml() + `<div class="setup"><h1>kira desk</h1>
      <p>机の上に置いておく、見るだけの画面です。Anki の kira の「設定 › 2人で使う」にある<b>ルームコード</b>を入れてください（この端末にだけ保存されます）。</p>
      <input id="room" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="kira-…">
      <div class="btns"><button class="btn" id="save">はじめる</button></div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}</div><div></div>`;
    lastHM = ""; bindHeader(); tickClock();
    document.getElementById("save").onclick = () => {
      const v = document.getElementById("room").value.trim();
      if (!v) return;
      room = v; store.set(ROOM_KEY, v); error = "";
      document.querySelector(".setup").innerHTML = "<p>読み込んでいます…</p>";
      load();
    };
  }

  function settings() {
    const ps = players();
    const sh = document.createElement("div");
    sh.className = "sheet";
    sh.innerHTML = `<div class="setup"><h1>⚙ 設定</h1>
      <p>左に出す人（自分）を選んでください。</p>
      <div class="btns">${ps.map((p) => `<button class="btn ${store.get(ME_KEY) === p.player ? "" : "sub"}" data-me="${esc(p.player)}">${esc(p.name)}</button>`).join("")}</div>
      <p style="margin-top:16px">⏱ 自分が Anki でタイマー・ストップウォッチ・ポモドーロを測っている間は、真ん中に大きく出ます。勉強 ⇄ 休憩に切りかわると、画面いっぱいで知らせます。</p>
      <div class="btns"><button class="btn ${store.get("kira-desk-sound") === "off" ? "sub" : ""}" id="snd">🔔 切りかわりの音：${store.get("kira-desk-sound") === "off" ? "なし" : "あり"}</button><button class="btn sub" id="sndtest">▶ 試す</button></div>
      <p style="margin-top:16px">輪は、上の「🎯 目標／📋 計画／🔄 交互」で切り替えられます（交互は20秒ごと）。<br>
        画面をつけたままにするには、iPad なら「設定 › 画面表示と明るさ › 自動ロック › なし」がおすすめです。<br>
        Safari の「共有 › ホーム画面に追加」で、アプリのように全画面で開けます。</p>
      <div class="btns"><button class="btn sub" id="rmroom">ルームコードを消す</button><button class="btn" id="close">閉じる</button></div></div>`;
    document.body.appendChild(sh);
    sh.querySelectorAll("[data-me]").forEach((b) => (b.onclick = () => { store.set(ME_KEY, b.dataset.me); sh.remove(); built = false; prev = null; render(); }));
    sh.querySelector("#close").onclick = () => sh.remove();
    sh.querySelector("#snd").onclick = (e) => { e.stopPropagation(); store.set("kira-desk-sound", store.get("kira-desk-sound") === "off" ? "on" : "off"); sh.remove(); settings(); };
    sh.querySelector("#sndtest").onclick = (e) => { e.stopPropagation(); unlockAudio(); phaseAlert("🍅", "集中 2回目 スタート", "（試しに出しています）", TCOL.work, "work"); };
    sh.querySelector("#rmroom").onclick = () => { if (confirm("この端末に保存したルームコードを消しますか？")) { store.del(ROOM_KEY); room = ""; rows = []; sh.remove(); setup(); } };
    sh.onclick = (e) => { if (e.target === sh) sh.remove(); };
  }

  function animateBars() {
    void app.offsetWidth;  // いまの位置を一度確定させてから動かす
    requestAnimationFrame(() => {
      document.querySelectorAll(".ring .pr").forEach((c) => { c.style.strokeDashoffset = c.dataset.off; lastPos[c.id] = Number(c.dataset.off); });
      document.querySelectorAll("[data-w]").forEach((s) => { s.style.width = s.dataset.w + "%"; lastPos[s.id] = Number(s.dataset.w); });
    });
  }

  function render() {
    if ((!room && !DEMO) || (error && !rows.length)) { setup(error); return; }
    const ps = players();
    const me = ps[0], rv = ps[1];
    const vs = vsPanel(me, rv);
    if (!built) {
      app.innerHTML = headerHtml() + `<main class="main" id="main"></main>
        <div><div id="tick"></div><div class="foot"><span id="upd" class="live"></span><span>KIRA DESK ・ v2</span></div></div>`;
      bindHeader();
      lastHM = ""; tickClock();
      built = true;
      Object.keys(shown).forEach((k) => delete shown[k]);
      Object.keys(lastPos).forEach((k) => delete lastPos[k]);
      app.classList.remove("ready");
    }
    const exHtml = examHtml(ps), exEl = document.getElementById("exam");
    if (exEl.dataset.k !== exHtml) { exEl.innerHTML = exHtml; exEl.dataset.k = exHtml; }
    tickExam();
    document.getElementById("main").innerHTML = (me ? panel(me, "me") : "") + vs.html + (rv ? panel(rv, "rv") : '<section class="panel rv"><div class="empty">相手のデータを待っています…</div></section>');
    const tk = ticker(ps), tEl = document.getElementById("tick");
    if (tEl.dataset.k !== tk) { tEl.innerHTML = tk; tEl.dataset.k = tk; }
    document.getElementById("upd").textContent = fetchedAt ? `LIVE ・ ${hhmm(fetchedAt)} 更新 ・ 30秒ごと${error ? " ・ " + error : ""}` : "";
    animateBars();
    // 今の描画の要素だけに入れる（前の描画の分があとから動いて、0点から上がったように見えないように）
    const scEls = [[document.getElementById("me-sc"), vs.a], [document.getElementById("rv-sc"), vs.b]];
    requestAnimationFrame(() => scEls.forEach(([el, v]) => { if (el && el.isConnected) countTo(el, v, true); }));
    if (!app.classList.contains("ready")) setTimeout(() => app.classList.add("ready"), 3000);  // 2回目からは、出てくるときの動きはしない
    celebrate(ps);
    tickTimer();
    // はじめて開いたとき：どちらが自分かを選んでもらう（タイマーは自分の分を大きく出すため）
    if (ps.length > 1 && !store.get(ME_KEY) && !document.querySelector(".sheet") && !askedMe) { askedMe = true; settings(); }
  }

  // 焼き付き防止：1分ごとに少しだけ位置をずらす
  setInterval(() => { app.style.transform = `translate(${Math.round((Math.random() - 0.5) * 8)}px, ${Math.round((Math.random() - 0.5) * 6)}px)`; }, 60000);
  // 交互：20秒ごとに 目標 ⇄ 計画
  setInterval(() => { if (ringMode === "swap" && built) { swapShow = swapShow === "goals" ? "plan" : "goals"; redrawRings(); } }, 20000);
  // 自分のいまの数字を、ときどき真ん中に大きく
  setInterval(insightSpot, 40000);

  window.addEventListener("resize", size);
  size();
  requestAnimationFrame(sparkLoop);
  theme();
  setInterval(() => { tickClock(); if (built) tickTimer(); }, 1000);
  // 自分が測っている間は10秒ごとに読む（一時停止・再開をすぐ反映）
  setInterval(() => { if (heroOn && document.visibilityState === "visible") load(); }, 10000);
  setInterval(() => { if (document.visibilityState === "visible") load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { load(); if (wakeLock !== null) keepAwake(); } });
  // 最初にどこかを押したら、画面をつけたままにする（ブラウザの決まりで、押したときしか頼めない）
  if ("wakeLock" in navigator) {
    const w = document.createElement("div");
    w.className = "wake"; w.id = "wake"; w.textContent = "🔆 画面を押すと、つけたままにします";
    document.body.appendChild(w);
    setTimeout(() => { w.style.opacity = "0"; }, 12000);
    document.addEventListener("click", () => { if (!wakeLock) keepAwake(); });
  }
  document.addEventListener("click", unlockAudio);
  render();
  load();
})();
</script>
</body>
</html>
